kernel: packed_i9
inputs: [FR0 rows at x2 with 96-byte row stride; R^-1 input]
outputs: [packed top-half scratch at x0; unchanged s8 tail at x1]
dependencies: [coefficient loads precede arithmetic; producer stores feed consumer loads; pointer updates order stores]
