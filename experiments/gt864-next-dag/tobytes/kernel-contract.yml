mode: new_symbolic_kernel
candidate_status: investigate
kernel:
  id: early_pair
  name: early_pair
  source: candidate.sym.S
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76_hardware_n1_proxy_model
slothy:
  workflow: ra-then-window-opt
  allow_spills: false
  driver: optimize.py
region:
  start_label: early_pair_slothy_start
  end_label: early_pair_slothy_end
  live_in: [x0, x1, x2, x3, x4]
  live_out: [x0]
abi:
  inputs: [two FR0 streams x1 and x2; each 9 vectors at 48-byte stride]
  outputs: [final byte pairs at x0 with nine-byte stride and public row permutation]
  concrete_gprs_allowed: [x0, x1, x2, x3, x4, x5, x6, x7, x8, x9, x10, x11, x12, x13, x14, x15, x16, x17, x30, sp]
  fixed_vector_registers: []
  reserved_registers: [x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30]
instruction_dag:
  file: instruction-dag.yml
layout:
  input_representation: two FR0 streams x1 and x2; each 9 vectors at 48-byte stride
  output_representation: final byte pairs at x0 with nine-byte stride and public row permutation
memory_contract:
  loads: [18 coefficient vectors once plus routing masks x3 and indices x4]
  stores: [216 bytes in disjoint 3-byte groups within 648-byte top output]
  aliasing: disjoint input and output
  alignment: halfword input and byte output; no wider requirement
  public_offsets_only: true
constant_contract:
  constants: [q3457, existing public table values]
  modulus: 3457
  representation: R0
range_contract:
  input_ranges: [signed int16]
  output_ranges: [bytes 0 through 255]
constant_time_contract:
  secret_inputs: [coefficient lanes]
  public_inputs: [pointers, tables, loop indices]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 ../model.py
  test_command: pending allocated-assembly differential harness
  full_path_benchmark_command: pending allocated-assembly KEM paired harness
