observation: P32 removed 173 complete-Inverse instructions but its six-bank phase barrier and 10932-byte terminal body reduced IPC from 1.7044 to 1.6326 and regressed Inverse by 106.664 cycles.
primary_bottleneck_category: instruction-fetch and scheduling locality around terminal constant sharing
hypothesis: sharing terminal constants within a reusable two-bank helper retains half of P32's load reduction while avoiding its global six-bank barrier and oversized terminal body.
exact_proposed_change: materialize half-zero prefix in its consumed block; keep half-one prefix in registers; load each column's four terminal constants once and consume both halves before advancing.
expected_static_effect: remove 192 composite Q loads and add 48 preterminal Q stores plus 48 Q loads, for a predicted net reduction of 96 main instructions versus production.
expected_performance_effect: recover production-like IPC while reducing the complete Inverse and Decaps cycle counts.
expected_register_pressure_effect: sixteen live B states plus q; each terminal window must fit constants, one A state and temporary values in v0-v31 without spill.
correctness_or_range_impact: none; exact P13-B terminal math, output offsets, scale and bounds are unchanged.
falsifying_measurement: allocation spills or fails, static main count is not below 4002, pair helper remains P32-sized, or the upper quartile of paired complete-Inverse or Decaps cycle deltas is nonnegative.
