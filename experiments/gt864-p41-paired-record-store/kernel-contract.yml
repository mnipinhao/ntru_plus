mode: existing_region_replacement
candidate_status: reject
kernel:
  id: gt864_p41_paired_record_store
  name: P41 paired 12-byte ToBytes consumer
  source: candidate-full.sym.S and candidate-small.sym.S
  scheme: NTRU+864 GT
  operation: FR0 normalization, P24 global route, 12-bit packing and paired wire store
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76
slothy:
  workflow: constructive route allocation then bounded fixed-allocation timing
  allow_spills: false
  driver: optimize.py
region:
  start_label: p41_top_full_slothy_start and p41_top_small_slothy_start
  end_label: p41_top_full_slothy_end and p41_top_small_slothy_end
  live_in: [x0 output top base, x1 FR0 input top base, v26 pack-index, v27 q3457, Full v28 reciprocal9]
  live_out: [648 exact canonical wire bytes at x0]
abi:
  inputs: [x0, x1]
  outputs: [memory at x0 through x0 plus 647]
  clobbers: [x2, x5, x6, x7, x8, allocated v0-v25, v26-v31]
  concrete_gprs_allowed: [x0, x1, x2, x5, x6, x7, x8]
  fixed_vector_registers: [v26, v27, v28, v29, v30, v31]
  reserved_registers: [v26, v27, v28, v29, v30, v31, x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30, sp]
layout:
  input_representation: unchanged production P24 FR0 tile-major signed int16
  output_representation: unchanged Official canonical 12-bit wire order
  vector_lanes: signed 8x16-bit before packing; A's Q store has valid bytes 0..11 and temporary bytes 12..15
  packing: A uses Q; B overwrites A bytes 12..15 with S and writes B bytes 4..11 with D
memory_contract:
  loads: [no more coefficient Q loads than the paired route search reports; one public pack-index load per top]
  stores: [27 fixed-offset Q stores, 27 fixed-offset S stores and 27 fixed-offset D stores per top]
  aliasing: unchanged disjoint serializer input and output
  alignment: aligned coefficient Q loads; unscaled public byte-offset Q and D stores
  public_offsets_only: true
constant_contract:
  constants: [unchanged q3457, reciprocal9, exact P24 pack-index]
  modulus: 3457
  representation: unchanged FR0 to canonical unsigned 0 through 3456 before 12-bit packing
  reduction_method: unchanged Full Algorithm-10 b=1 normalization; unchanged Small sign correction only
range_contract:
  input_ranges: [unchanged Full arbitrary signed int16; unchanged Small strict negative q to q producer range]
  intermediate_ranges: [unchanged P24 normalization; route and terminal pairing are byte permutations]
  output_ranges: [exact unchanged 648-byte top wire image]
constant_time_contract:
  secret_inputs: [FR0 coefficient lanes]
  public_inputs: [pointers, fixed coordinate map, pack-index]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 oracle.py
  test_command: exact-byte differential plus alias AAPCS wipe KAT and malformed rejection
  full_path_benchmark_command: paired Pi5 complete Full and Small ToBytes then Keygen Encaps Decaps PMU
  benchmark_metric: cycles
  lower_is_better: true
