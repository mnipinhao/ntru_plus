  reserved_registers: [x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30, sp]
instruction_dag:
  file: instruction-dag.yml
  summary: unchanged P13-B arithmetic with two-output SSA butterflies and no held-value ORR nodes
layout:
  input_representation: sixteen vectors with top0 rows0-3 in lanes0-3 and top1 rows0-3 in lanes4-7
  output_representation: unchanged natural-order raw R0 int16 coefficients
  vector_lanes: signed 8x16-bit
  packing: unchanged P13-B packed top halves
memory_contract:
  loads: [same 16 input Q vectors, same stage loads, same 64 composite Q-vector loads]
  stores: [same 128 STRH offsets]
  aliasing: unchanged outer scratch provides public exact alias safety
  alignment: 16-byte input/table loads and halfword output stores
  public_offsets_only: true
  pointer_updates: []
constant_contract:
  constants: [q3457, unchanged inverse16 roots, unchanged P13-B composite constants, magic9]
  modulus: 3457
  representation: unchanged I9 R^-1 to natural R0
  reduction_method: unchanged Algorithm-10 Barrett-Shoup and selective b=1 resets
range_contract:
  input_ranges: [abs <=2617]
  intermediate_ranges: [unchanged I16 abs <=21397, terminal pre-reset abs <=5278]
  output_ranges: [unchanged raw natural R0 abs <=4454]
  narrowing_points: [unchanged signed int16 arithmetic]
constant_time_contract:
  secret_inputs: [coefficient lanes]
  public_inputs: [pointers, fixed tables, fixed offsets]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 oracle.py
  test_command: native exact main-I16 then complete KEM KAT malformed alias AAPCS wipe
  full_path_benchmark_command: taskset CPU3 paired main-I16 and complete Decaps PMU on Pi5
