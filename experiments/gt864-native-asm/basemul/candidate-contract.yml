mode: new_symbolic_kernel
candidate_status: investigate
kernel:
  id: bm_rinv_tile
  name: bm_rinv_tile
  source: candidate.sym.S
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
slothy:
  workflow: ra-then-window-opt
  allow_spills: false
  driver: ../optimize.py
region:
  start_label: bm_rinv_tile_slothy_start
  end_label: bm_rinv_tile_slothy_end
  live_in: [x0, x1, x2, x3]
  live_out: [x0, x1, x2, x3]
abi:
  inputs: ["x0 output 48 bytes; x1 a 48 bytes; x2 b 48 bytes; x3 zR 16 bytes"]
  outputs: ["FR0 product R^-1 each abs <=2497"]
  concrete_gprs_allowed: [x0, x1, x2, x3, x4, x8, x30]
  fixed_vector_registers: []
  reserved_registers: [x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30]
instruction_dag:
  file: instruction-dag.yml
layout:
  input_representation: "FR0 R0 inputs each [0,4095]"
  output_representation: "FR0 product R^-1 each abs <=2497"
memory_contract:
  loads: ["6 operand Q loads plus zR Q"]
  stores: ["3 output Q stores"]
  alignment: 2 bytes; Q accesses need not be 16-byte aligned
  aliasing: all input loads precede stores; exact input-output alias allowed; partial overlap forbidden
  public_offsets_only: true
constant_contract:
  constants: [3457, -12929, 867, -147, 9, 1728]
  modulus: 3457
  representation: explicit R0 R1 and R^-1 edge ledger
range_contract:
  input_ranges: ["FR0 R0 inputs each [0,4095]"]
  intermediate_ranges: [signed int32 widening; REDC product plus correction must fit int32]
  output_ranges: ["FR0 product R^-1 each abs <=2497"]
constant_time_contract:
  secret_inputs: [coefficients]
  public_inputs: [pointers, constants]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 ../verify.py
  test_command: pending allocated assembly differential and ABI tests
  full_path_benchmark_command: deferred by user for this source-authoring gate
