  expected_register_pressure_effect: use all 32 SIMD registers without spill
  correctness_or_range_impact: none in P7-B0; P7-B1 preserves the fixed contract
  falsifying_measurement: >-
    No NTT/routing region has sufficient cost or no isolated deletion survives
    complete Inverse and Decaps timing; in that case close P7-B before P8.
