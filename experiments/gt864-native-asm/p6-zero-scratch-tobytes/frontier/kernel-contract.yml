mode: new_symbolic_kernel
candidate_status: investigate
kernel:
  id: gt864_p6_register_frontier
  name: GT864 ToBytes current-route register frontier
  source: candidate.sym.S
  scheme: NTRU+864
  operation: allocation feasibility of retained pairs plus current third-pair first row
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76
slothy:
  workflow: allocation-only exact frontier
  driver: optimize.py
  expected_outputs: [candidate.alloc.S, slothy-ra.log]
  allow_spills: false
region:
  start_label: gt864_p6_register_frontier_slothy_start
  end_label: gt864_p6_register_frontier_slothy_end
  expected_instruction_count: 67
  live_in: [x0 output, x2 public index, x3 synthetic frontier seed]
  live_out: [all symbolic live-ins, Q<row0>, first frontier sink values]
abi:
  inputs: [exact peak-liveness frontier values described by frontier.py]
  outputs: [allocation feasibility and first 72-byte row]
  clobbers: [v0-v31, x0-x17, x19-x30, NZCV]
  concrete_gprs_allowed: [x0-x17, x19-x30]
  fixed_vector_registers: []
  reserved_registers: [x18, sp]
instruction_dag:
  file: instruction-dag.yml
  summary: current route must create a row copy and route index while 31 vector values remain live
layout:
  input_representation: 13 vector-equivalent retained byte slots plus current 18-vector third-pair route state
  output_representation: first 72-byte final row and all values needed by future rows
  vector_lanes: eight halfwords or sixteen bytes according to node
  packing: exact retained capacity frontier
memory_contract:
  loads: [31 synthetic Q loads used only to seed exact live values, one public row index]
  stores: [31 synthetic live-out Q stores, one first-row frontier store]
  aliasing: disjoint input and output
  alignment: halfword input and byte output
  public_offsets_only: true
  pointer_updates: [none]
constant_contract:
  constants: [q 3457, reciprocal 9, row0 route and merge indices]
  modulus: 3457
  representation: R0 coefficients to canonical bytes
  reduction_method: unchanged Algorithm-10 Barrett then conditional add q
range_contract:
  input_ranges: [signed int16 coefficients and bytes 0 to 255]
  intermediate_ranges: [canonical coefficients 0 to 3456]
  output_ranges: [72 final bytes 0 to 255]
  narrowing_points: [XTN after canonicalization]
constant_time_contract:
  secret_inputs: [coefficient and retained byte values]
  public_inputs: [pointers and indices]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 ../frontier.py
  test_command: allocation-only screening gate; no production correctness claim
  full_path_benchmark_command: not permitted until a complete candidate exists
  benchmark_metric: cycles
  lower_is_better: true
