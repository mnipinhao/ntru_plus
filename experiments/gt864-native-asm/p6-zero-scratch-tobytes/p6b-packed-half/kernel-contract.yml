mode: new_symbolic_kernel
candidate_status: investigate
kernel:
  id: gt864_p6b_packed_half_frontiers
  name: GT864 zero-scratch ToBytes packed-half frontiers
  source: candidate.sym.S
  scheme: NTRU+864
  operation: allocation feasibility of single-stream route repair and full normalization after packed-A compression
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76
slothy:
  workflow: allocation-only exact frontiers
  driver: optimize.py
  expected_outputs: [candidate.alloc.S, slothy.log]
  allow_spills: false
region:
  start_label: gt864_p6b_route_frontier_slothy_start
  end_label: gt864_p6b_full_normalize_frontier_slothy_end
  live_in: [twenty retained-state vectors, nine single-stream row vectors, public literal base]
  live_out: [all retained-state vectors, all row vectors after exact repair and one fully normalized row]
abi:
  inputs: [two retained packed pairs, compressed canonical A half of pair 2, B route rows]
  outputs: [allocation feasibility for the two separately optimized frontiers]
  clobbers: [v0-v31, x0-x17, x19-x30, NZCV]
  concrete_gprs_allowed: [x0-x17, x19-x30]
  fixed_vector_registers: []
  reserved_registers: [x18, sp]
instruction_dag:
  file: instruction-dag.yml
  summary: repair one nine-vector B route under twenty retained vectors, then normalize under an independent twenty-nine-data-vector frontier
layout:
  input_representation: 432 retained bytes in thirteen Q plus twenty-eight X slots; 108 packed-A bytes in seven Q slots; nine B row vectors
  output_representation: unchanged retained bytes and exact canonical pair-2 bytes ready for consumer merge
  vector_lanes: eight halfwords before narrowing and sixteen bytes after packing
  packing: A low bytes plus two A high nibbles per byte, totaling 108 bytes
memory_contract:
  loads: [synthetic exact-liveness seeds, one public route index, q and reciprocal9 constants]
  stores: [synthetic frontier live-outs only]
  aliasing: disjoint synthetic input and output
  alignment: sixteen-byte synthetic frontier buffers
  public_offsets_only: true
  pointer_updates: [none]
constant_contract:
  constants: [q 3457, reciprocal9, public row permutation index]
  modulus: 3457
  representation: R0 coefficients to canonical 12-bit bytes
  reduction_method: unchanged full ToBytes Barrett normalization and conditional add q
range_contract:
  input_ranges: [signed int16 producer values accepted by full ToBytes, canonical packed A values 0 to 3456]
  intermediate_ranges: [canonical B values 0 to 3456, A high nibbles 0 to 13]
  output_ranges: [pair bytes 0 to 255]
  narrowing_points: [XTN after canonicalization, nibble packing after A high extraction]
constant_time_contract:
  secret_inputs: [coefficient and retained byte values]
  public_inputs: [pointers and fixed routing tables]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 model.py
  test_command: local Slothy allocation-only frontier checks with spills disabled
  full_path_benchmark_command: forbidden until complete full and small candidates exist
  benchmark_metric: cycles
  lower_is_better: true
