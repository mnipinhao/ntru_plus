  expected_register_effect: Peak exactly 32 vectors in B normalization and at most 32 in three-part merge.
  correctness_impact: Byte layout changes internally only; final 1,296 bytes must remain identical.
  falsifier: Any tagged-byte mismatch, non-consecutive TBL allocation, spill, physical-register infeasibility, extra coefficient load, coefficient scratch, or peak above 32.
