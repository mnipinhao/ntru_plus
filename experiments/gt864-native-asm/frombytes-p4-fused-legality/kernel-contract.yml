mode: existing_region_replacement
candidate_status: investigate
kernel:
  id: gt864_p4_checked_frombytes
  name: GT864 cluster-transpose FromBytes with fused legality accumulation
  source: candidate-cluster.c and candidate-byte-api.c
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
slothy:
  workflow: inspect compiler-emitted assembly first; extract only if a scheduling candidate is justified
  allow_spills: false
region:
  start_label: gt864_fr0_cluster_transpose_frombytes_checked
  end_label: C function return
  live_in: [out pointer, in pointer]
  live_out: [FR0 output memory, noncanonical status]
abi:
  inputs: [1296-byte packed polynomial at in]
  outputs: [1728-byte FR0 polynomial at out, integer noncanonical status]
  clobbers: [C ABI caller-saved registers]
  concrete_gprs_allowed: [x0, x1]
  fixed_vector_registers: []
  reserved_registers: [sp, x29, x30]
instruction_dag:
  file: instruction-dag.yml
layout:
  input_representation: 864 consecutive unsigned 12-bit encodings
  output_representation: unchanged GT FR0 cluster-transpose layout
memory_contract:
  loads: [exactly the existing 1296 input bytes; no output legality reread]
  stores: [exactly the existing 1728 output bytes during routing]
  alignment: existing byte input and 16-byte output assumptions
  aliasing: input and output disjoint
  public_offsets_only: true
constant_contract:
  constants: [unpack index, unpack shifts, mask 4095, modulus 3457]
  modulus: 3457
  representation: unsigned decoded coefficient; FR0 routing is a pure permutation
range_contract:
  input_ranges: [input bytes unsigned]
  intermediate_ranges: [each unpacked lane in unsigned [0,4095], maximum in unsigned [0,4095]]
  output_ranges: [FR0 lanes unsigned [0,4095], status is exactly maximum >=3457]
constant_time_contract:
  secret_inputs: [packed polynomial bytes]
  public_inputs: [pointers, fixed input and output offsets]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 verify.py
  test_command: production KAT plus boundary and malformed ciphertext differential
  full_path_benchmark_command: python3 run_pi5.py
