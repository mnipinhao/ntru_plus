mode: existing_region_replacement
candidate_status: investigate
kernel:
  id: p13c_itail
  name: fused terminal-scale and top-CRT tail inverse16
  source: candidate.sym.S
  scheme: NTRU+864 GT
  operation: tail inverse NTT16 terminal map and natural scatter
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76
slothy:
  workflow: allocate then bounded timing windows
  driver: optimize.py
  expected_outputs: [candidate.alloc.S, candidate.opt.S, slothy-ra.log, slothy-timing.log]
  allow_spills: false
region:
  start_label: p13c_itail_slothy_start
  end_label: p13c_itail_slothy_end
  expected_instruction_count: 603
  live_in: [x0, x1, x3, x4]
  live_out: [memory at x0]
abi:
  inputs: [x0 natural output base, x1 packed tail scratch, x3 unchanged stage table, x4 composite terminal table]
  outputs: [96 natural-order int16 stores at unchanged fixed offsets]
  clobbers: [w8, w9, allocated v0-v31]
  concrete_gprs_allowed: [x0, x1, x3, x4, x8, x9]
  fixed_vector_registers: []
  reserved_registers: [x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30, sp]
instruction_dag:
  file: instruction-dag.yml
  summary: unchanged CT I16 then two tail-specific composite lane-packed CRT linear forms and exact scatter
layout:
  input_representation: lanes0-2 are top0 components0-2, lanes3-5 are top1 components0-2, lanes6-7 are zero padding
  output_representation: unchanged natural-order raw R0 int16 coefficients
  vector_lanes: signed 8x16-bit
  packing: fixed final Good-Thomas row with three degree-3 components per top
memory_contract:
  loads: [same 16 input Q vectors, same stage loads, four composite Q vectors per output column]
  stores: [same 96 STRH offsets]
  aliasing: exact alias handled by unchanged outer 1792-byte scratch
  alignment: halfword output and 16-byte input/table loads
  public_offsets_only: true
  pointer_updates: []
constant_contract:
  constants: [q3457, unchanged inverse16 roots, tail composite low and high CRT coefficients, b1 magic9]
  modulus: 3457
  representation: I9 R^-1 input to natural R0 output
  reduction_method: Algorithm-10 Barrett-Shoup plus selective b=1 quotient and MLS reset
range_contract:
  input_ranges: [P7-C1 I9 output abs <= 2617]
  intermediate_ranges: [I16 abs <= 21397, each composite product abs < 3457, pre-reset sums abs <= 5278]
  output_ranges: [selective reset yields raw natural R0 abs <= 4303 and preserves baseline <=4577]
  narrowing_points: [all arithmetic fits signed int16]
constant_time_contract:
  secret_inputs: [coefficient lanes]
  public_inputs: [pointers, tables, fixed offsets]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: python3 prove.py and python3 oracle.py
  test_command: isolated native differential KAT alias AAPCS wipe malformed tests
  full_path_benchmark_command: taskset -c 3 paired inverse-to-ternary and Decaps PMU harness on Pi5
  benchmark_metric: cycles
  lower_is_better: true
