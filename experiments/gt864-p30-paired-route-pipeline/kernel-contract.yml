mode: existing_region_replacement
candidate_status: investigate
kernel:
  id: gt864_p30_paired_route_pipeline
  name: two-record software-pipelined P29 direct-ST3 route
  source: candidate-route.sym.S
  scheme: NTRU+864 GT
  operation: schedule P29 main route across adjacent top/t records
target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76
slothy:
  workflow: allocate and A76 timing-schedule 16 independent two-record windows
  driver: optimize.py
  expected_outputs: [candidate-route.alloc.S]
  allow_spills: false
region:
  start_label: p29_main_route_slothy_start
  end_label: p29_main_route_slothy_end
  expected_instruction_count: 873
  live_in: [x0 natural output, x1 paired main scratch]
  live_out: [rows 0 through 7 in natural ternary order]
abi:
  inputs: [natural output pointer, paired main scratch pointer]
  outputs: [768 natural-order ternary coefficients]
  clobbers: [x2, x3, v0-v31]
  concrete_gprs_allowed: [x0, x1, x2, x3]
  fixed_vector_registers: []
  reserved_registers: [x4-x30, sp]
instruction_dag:
  file: instruction-dag.yml
  summary: exact P29 operations with independent adjacent records exposed in one scheduling window
layout:
  input_representation: 96 paired Q records in P29 equal-half scratch order
  output_representation: rows 0 through 7 at natural top/t/component order
  vector_lanes: signed 8x16-bit with low and high four-row halves
  packing: two full-vector ST3.4h stores per record
memory_contract:
  loads: [96 scratch Q]
  stores: [64 full-vector ST3.4h]
  aliasing: output distinct from scratch
  alignment: scratch 16-byte aligned; natural output may be 2-byte aligned
  public_offsets_only: true
  pointer_updates: [exact P29 postincrement sequence and output order]
constant_contract:
  constants: [1728, -1728, 10923, 3]
  modulus: 3 after unchanged q-domain terminal transform
  representation: signed raw R0 to ternary
  reduction_method: exact P29 threshold adjustment and Barrett modulo 3
range_contract:
  input_ranges: [raw abs <= 4577]
  intermediate_ranges: [adjusted raw abs <= 4576]
  output_ranges: [ternary abs <= 1]
  narrowing_points: [none]
constant_time_contract:
  secret_inputs: [coefficient lanes]
  public_inputs: [pointers, fixed offsets]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
validation:
  oracle_command: reuse P29 exact C/assembly oracle and tagged coordinate audit
  test_command: integrated KEM KAT malformed alias AAPCS scratch-wipe and object parity checks
  full_path_benchmark_command: taskset -c 3 paired P29 versus P30 then production versus P30 PMU on Pi5
  benchmark_metric: cycles
  lower_is_better: true
contract_changes:
  approved_for_experiment: []
  unchanged_public_contract: [function ABI, arithmetic, layout, memory multiset, ranges, constant-time policy]
  promotion_requires_explicit_user_decision: true
