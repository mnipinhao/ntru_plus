dag:
  id: gt864_p51_equal_dag
  kernel_contract: kernel-contract.yml
  description: Repeated two-vector subtract, reciprocal reduction, and OR accumulation
inputs: [regenerated 864, recovered 864]
constants: [q 3457, reciprocal 9]
nodes:
  - id: chunk_0_to_53
    op: residue_zero_test
    inputs: [regenerated lanes, recovered lanes, q, reciprocal]
    outputs: [signed reduced residues]
    instruction_shape: LDP LDP SUB SUB SQRDMULH SQRDMULH MLS MLS
    tied_operands: [SUB and MLS overwrite regenerated temporaries]
    range_before: exact per-leaf differences fit signed int16
    range_after: each lane is -3291 to 3291 and zero iff difference is divisible by q
    may_reorder_with: [other chunks subject to public pointer order]
    must_precede: [or_reduce]
  - id: or_reduce
    op: bitwise OR accumulation and horizontal maximum
    inputs: [all reduced residues]
    outputs: [w0 mismatch]
    instruction_shape: ORR chains then UMAXV UMOV CMP CSET
    tied_operands: [three accumulator vectors]
    range_before: signed residues treated as bit patterns
    range_after: w0 is zero or one
    may_reorder_with: []
    must_precede: [return]
memory:
  loads: [fixed sequential 1728-byte read from each operand]
  stores: []
  ordering_constraints: [post-index x0 and x1 updates retain public sequential order]
outputs: [w0 mismatch]
live_out: [w0]
review:
  all_outputs_traced: true
  tied_operands_checked: true
  memory_order_checked: true
  ranges_checked: true
