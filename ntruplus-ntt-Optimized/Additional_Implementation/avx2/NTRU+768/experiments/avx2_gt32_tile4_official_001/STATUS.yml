implemented:
  - generator-owned complete frontend/output/inverse mapping
  - compact execution-order forward and inverse twiddle streams
  - scalar forward and inverse TILE4 oracle
  - scalar and AVX2 direct frontend materialization into TILE4
  - leaf direct frontend assembly with generated Q-pair execution streams
  - pair-packed stage-4/stage-5 schedule selected; serial and 3+3+2 retained as controls
  - small-input raw -722 top split with proved [-2891,2896] output range
  - generator-expanded fixed-displacement frontend
  - combined fixed/raw frontend and pair-packed core leaf symbol
  - matched 16-byte producer/consumer load experiment
  - N5 contiguous quartic-qword loads and immediate vpblendd GT permutation
  - N5 branch/n3 execution-order twist streams and six 32-byte stores
  - combined N5 frontend plus pair-packed core leaf symbol
  - inverse I1 pair-packed raw qword and Montgomery local-half stages
  - generator-owned R-exponent scale contract and physical-Q lambda streams
  - generator-owned serialized-to-TILE4-AoS and serialized-to-private-BM-SoA bijections
  - correctness-first constant-work private frombytes layouts and rejection contract
  - mixed private-SoA by TILE4-AoS basemul assembly without the a-input transpose
  - native TILE4 B0 scalar oracle and exact e=-1 schoolbook scale check
  - native TILE4 B2 register-transpose quartic assembly
  - B3 late-finalizer and B4b partial-hoist multi-accumulator rejected controls
  - K1/K2 outer/full Karatsuba intrinsic gates and zero-spill K2 assembly control
  - B5 raw private-SoA e=-1 producer accepted through private inverse NTT32 core
  - B5-AoS raw control, proof-safe inverse checkpoint control and selected c3-only BM checkpoint
  - c3 register retention overlaps its center with output-plane reloads
  - Gate C general B2 with fused R-squared e=0 output
  - Gate D B2-S private coefficient-plane e=-1 producer
  - direct private-layout scalar inverse NTT32 oracle
  - serial and eight-vector parallel private I2 inverse assembly
  - generator-owned private-Q inverse twiddles and formal range bounds
  - generator-owned AoS inverse-tail branch matrix and formal range bounds
  - zero-spill AoS inverse-tail assembly with fused IDFT3, GT blend, untwist, top merge, normalization and canonical stores
  - decap-private inverse-tail champion with one-Mont IDFT3, reduced centers, three-Mont reconstruction and bounded relaxed output
  - full coefficient-order input to TILE4 frequency-output forward candidate
  - five-layer register-resident AVX2 forward tile and six-tile wrapper
  - five-layer register-resident AVX2 inverse tile and six-tile wrapper
  - exact differential, modular round-trip, alias, sanitizer and spill audit
  - frozen-parent row-bitrev versus TILE4 full-forward modular differential
range:
  input: [-1728, 1728]
  conservative_max_abs: 30175
  signed_int16_safe: true
