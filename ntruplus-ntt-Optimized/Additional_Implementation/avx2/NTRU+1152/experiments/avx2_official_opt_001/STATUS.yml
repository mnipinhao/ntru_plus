  question: "does the NTRU+864 exp002 direct 12-bit codec (vpunpck + vpmaddwd(1,4096) + in-lane interleave + vpshufb, 16-byte stores) pay off for Official poly_tobytes/poly_frombytes?"
  decision: stopped_at_gate  # estimated and measured saving < ~50 cycles per call for both functions; no candidate built
  phase: analysis_plus_scratch_measurement  # no generator, no KEM binding, no SUPERCOP campaign, no Native
  layout: "8-way SoA per 128 coefficients: block b, register r, word l <-> wire coefficient 128b+8l+r (verified); wire pair (8l+2s, 8l+2s+1) = (R_2s[l], R_2s+1[l]) is in-lane; Official pack.s already packs directly from this layout in one pass (no natural-order transpose, no stack buffer)"
  kem_calls: {tobytes: {keypair: 3, encap: 2, decap: 2}, frombytes: {keypair: 0, encap: 1, decap: 3}}
  official_per_iteration:  # 128 coefficients; 9 iterations per call
    tobytes: {total: 118, freeze2op_total: 110, loads: 8, freeze: "48 (freeze2op 40)", bitpack: 16, inlane_transpose: 30, cross_lane: 6, stores_32B: 6, loop: 4, vector_uops_p01_p015_inlane_cross: "46/36/12/6 (freeze2op 38/36/12/6)"}
    frombytes: {total: 86, loads: 6, cross_lane: 6, inlane_transpose: 30, extract12: 22, canonical: 10, stores: 8, loop: 4, vector_uops_p01_p015_inlane_cross: "30/18/12/6 (+1 movmsk)"}
  official_per_call: {tobytes: 1066, tobytes_freeze2op: 994, frombytes: 781}
  designs:
    tobytes_madd: "exp002 literal: unpck wd + vpmaddwd -> 4x4 dword transpose -> vpshufb; 40 vector ops after freeze, 32 shuffles; 80 vector uops/iteration"
    tobytes_pack: "Official dense shift pack (16) -> 3 unpck wd pairs (6) -> 7-op in-lane dword interleave per half (14), no vpshufb; 76 vector uops/iteration (freeze2op 92); 16 x 16-byte stores ascending, last group 8+4 B"
    frombytes_word_route: "16-byte loads at 12*group (xmm + vinserti128; last group from -4 with shifted mask) -> vpshufb raw words -> 8x8 word transpose (24) -> and 0xfff / srlw 4 -> vpmaxuw accumulator; 56 vector uops/iteration (Official 67)"
    cross_lane_needed: false
