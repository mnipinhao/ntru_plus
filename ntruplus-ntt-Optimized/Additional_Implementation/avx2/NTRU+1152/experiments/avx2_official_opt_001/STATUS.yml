    instructions_per_call_perf: {tobytes_official: 1073, tobytes_freeze2op: 1001, tobytes_pack: 972, tobytes_madd: 1023, frombytes_official: 791, frombytes_word_route: 713}  # incl. ~7/~10 harness dispatch; results/codec8-scratch-instructions-20260923.json
