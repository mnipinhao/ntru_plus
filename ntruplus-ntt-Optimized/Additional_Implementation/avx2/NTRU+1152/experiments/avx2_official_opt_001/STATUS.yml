    tooling: [common/official_opt_lazy/codec8_scratch.mk, common/official_opt_lazy/bench/bench_codec8_scratch.c, common/official_opt_lazy/bench/count_codec8_scratch.c, common/official_opt_lazy/tools/run_codec8_scratch.py]
