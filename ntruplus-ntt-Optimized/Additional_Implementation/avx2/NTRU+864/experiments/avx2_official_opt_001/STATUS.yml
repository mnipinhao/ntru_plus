  design:
    freeze: "Official Barrett (vpmulhrsw _16xv, vpmullw _16xq, vpsubw) + 2-op canonicalisation vpaddw q / vpminuw (replaces vpsraw 15 / vpand q / vpaddw)"
    tobytes: "per 96 coefficients: freeze 6x5, vpunpck{l,h}wd (R_2s, R_2s+1) 6, vpmaddwd (1,4096) 6 -> 24-bit wire pairs in dwords, 5-op in-lane dword interleave per triple (unpckldq, unpckhdq, unpcklqdq, blendd 0xCC, unpckhqdq) x2, vpshufb 6 (order + drop 4th byte) -> one 12-byte wire group per 128-bit lane, 12 x 16-byte stores (vmovdqu xmm / vextracti128 m128); no cross-lane permute"
    frombytes: "mirror: 16-byte loads at 12*group (vmovdqu xmm + vinserti128 m128), vpshufb expand to [b0 b1 b2 0] dwords, inverse 5-op interleave, vpand 0xfff / vpsrld 12, vpackusdw -> 6-way layout; vpmaxuw accumulator + one vpcmpgtw q-1 at the end"
    option_b_vs_natural: "direct from the 6-way SoA chosen: 20 shuffle-class ops per 96 (6 unpckwd + 8 unpck dq/qdq + 6 pshufb) + 2 blendd vs 30 (pack's pair16/pair32/pairq) + 6 pshufb for the natural-order route; the 3-way dword interleave costs 5 ops per triple, not the 8 (2 pshufd + 6 blendd) first estimated"
    scheduling: "exp001 list scheduler (critical path first, register-pressure capped) plus an ordering chain for overlapping stores; pinning the pshufb masks in registers does not fit 16 ymm (allocator runs out), so masks stay RIP-relative memory operands"
