id: M5E
observation: >-
  The first M5E assembly used an eight-instruction widening Montgomery FQMUL
  and serialized every expanded macro, unlike the official/neon-ntt paired
  fixed-Barrett pattern.
bottleneck_hypothesis: >-
  Algorithm-10 mul/sqrdmulh/mls plus bounded independent grouping will reduce
  instruction count and expose enough ILP without making one whole transform a
  Slothy region or increasing spills.
candidate: >-
  Convert every public Montgomery constant to (normal b, rounded reciprocal),
  group NTT16 butterflies four at a time, group top recombination two at a
  time, and group radix-3 products according to their two/three-way structure.
falsifier:
  - any coefficient mismatch modulo q against M5D
  - any write to P8 tail padding
  - any stack reference or coefficient spill in an arithmetic block
  - any v8-v15 reference or branch in an arithmetic block
  - any extra full-buffer pass
result: passed
decision: replace_initial_M5E_with_barrett_grouped_experimental_baseline
next: handwritten_forward_NTT16_producer_and_composition
