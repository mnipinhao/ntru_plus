mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: gt864_forward_ntt16_ntt9_handoff
  name: GT864 NTT16 column-to-oriented-NTT9 fused handoff
  source: gt864_forward_ntt16_ntt9_handoff.sym.S
  scheme: NTRU+864
  operation: transpose two NTT16 column blocks, twist one block, and consume it with the complete paper-oriented NTT9 while preserving the other block

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_proxy_pi5_validation_required
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: RA-only allocation over 190 real instructions followed by real-instruction split-window scheduling
  driver: optimize.py
  expected_outputs:
    - build/gt864_forward_ntt16_ntt9_handoff.n1.alloc.S
    - build/gt864_forward_ntt16_ntt9_handoff.n1.opt.S
    - build/gt864_forward_ntt16_ntt9_handoff.n1.log
  allow_spills: false

region:
  start_label: gt864_forward_ntt16_ntt9_handoff_slothy_start
  end_label: gt864_forward_ntt16_ntt9_handoff_slothy_end
  expected_instruction_count: 190
  live_in:
