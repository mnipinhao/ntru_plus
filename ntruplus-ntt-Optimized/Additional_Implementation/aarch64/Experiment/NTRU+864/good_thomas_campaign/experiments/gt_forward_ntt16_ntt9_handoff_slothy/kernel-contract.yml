instruction_dag:
  file: instruction-dag.yml
  summary: two 24-instruction 8x8 halfword transposes, sixteen public constant loads, eight Algorithm-10 twists, and the 102-instruction M5I complete NTT9 core

layout:
  input_representation: sixteen NTT16 column vectors with s0..s7 in lanes plus two s8 tail vectors
  producer_main: Q<cN>.h[s] is NTT16 output at column N and row-coordinate s for N=0..15 and s=0..7
  producer_tail: Q<tail0>.h[lane] and fixed v16.h[lane] are row-coordinate s=8 for columns lane and 8+lane
  consumer_current: Q<fS>.h[lane] is row-coordinate S at column lane for columns 0..7
  consumer_held: Q<holdS>.h[lane] is row-coordinate S at column 8+lane; fixed v16 is S=8; all remain untwisted
  output_representation: paper-oriented NTT9 order for columns 0..7 plus untouched consumer-ready columns 8..15
  vector_lanes: eight independent signed int16 columns after transpose

memory_contract:
  loads:
    - sixteen sequential 16-byte public twist-constant loads from x3
  stores:
    - none
  coefficient_loads_or_stores: none
  public_table_bytes: 256
  aliasing: twist table is read-only and disjoint from coefficients
  alignment: x3 is 16-byte aligned
  public_offsets_only: true
  pointer_updates:
    - x3 advances by 16 bytes after each load, 256 bytes total

constant_contract:
  constants:
    - Q<roots>.h[0..7]=rho,rho-prime,rho2,rho2-prime,eta,eta-prime,eta-inverse,eta-inverse-prime
    - Q<modq>=3457 in every halfword
    - for s=1..8 the table stores b_s[8] followed by bprime_s[8]
    - b_s[lane]=theta^((residue+6*lane)*s) centered modulo 3457 for the selected top and column block
    - bprime_s[lane]=round(b_s[lane]*2^15/3457)
  modulus: 3457
  representation: normal R0 coefficients and normal fixed constants
  reduction_method: Algorithm-10 mul/sqrdmulh/mls fixed Barrett

range_contract:
  input_ranges:
    - exact NTT16 producer intervals from M5G, maximum magnitude 9342
  intermediate_ranges:
    - transpose preserves exact values
    - every twist output has magnitude at most 3436
    - complete correlation-aware NTT9 core maximum magnitude is 28568
  output_ranges:
    - transformed block union is [-28568,28565]
    - held block retains the exact NTT16 producer intervals
  narrowing_points: []

constant_time_contract:
  secret_inputs:
    - coefficient vectors Q<c0> through Q<c15>, Q<tail0>, and fixed live-through v16
  public_inputs:
    - roots, modulus, public twist table, fixed instruction sequence
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -C ../gt_forward_composition_barrett check
  test_command: make check
  full_path_benchmark_command: unavailable_until_full_Forward_integration
  benchmark_metric: cycles
  lower_is_better: true
