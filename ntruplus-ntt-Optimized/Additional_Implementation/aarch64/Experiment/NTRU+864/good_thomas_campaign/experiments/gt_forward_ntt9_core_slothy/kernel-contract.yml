instruction_dag:
  file: instruction-dag.yml
  summary: six correlation-safe 15-instruction B3 DAGs plus four 3-instruction Algorithm-10 eta products in consumer order

layout:
  input_representation: nine signed-int16 vectors f0 through f8 across eight public columns
  output_representation: paper-oriented order g0[0],g1[0],g2[1],g0[1],g1[1],g2[2],g0[2],g1[2],g2[0]
  vector_lanes: eight independent signed int16 lanes
  packing: roots lanes 0..7 are rho,rho-prime,rho2,rho2-prime,eta,eta-prime,eta-inverse,eta-inverse-prime

memory_contract:
  loads:
    - none_register_only_region
  stores:
    - none_register_only_region
  aliasing: register-only region
  alignment: not_applicable_inside_region
  public_offsets_only: true
  pointer_updates: []

constant_contract:
  constants:
    - Q<roots>.h[0]=rho=-723
    - Q<roots>.h[1]=rho-prime=-6853
    - Q<roots>.h[2]=rho2=722
    - Q<roots>.h[3]=rho2-prime=6844
    - Q<roots>.h[4]=eta=1124
    - Q<roots>.h[5]=eta-prime=10654
    - Q<roots>.h[6]=eta-inverse=366
    - Q<roots>.h[7]=eta-inverse-prime=3469
    - Q<modq>=3457 in every halfword
  modulus: 3457
  representation: normal R0 coefficients and normal fixed constants
  reduction_method: Algorithm-10 mul/sqrdmulh/mls fixed Barrett

range_contract:
  input_ranges:
    - exact per-position intervals come from M5G after NTT16 and twist
  intermediate_ranges:
    - prove_core.py imports the complete correlation-aware M5G Forward DAG
    - maximum exact complete-core node magnitude is 28568
  output_ranges:
    - exact full-core union is [-28568,28565]
  narrowing_points: []

constant_time_contract:
  secret_inputs:
    - coefficient vectors Q<f0> through Q<f8>
  public_inputs:
    - packed roots, modulus, and fixed region shape
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -C ../gt_forward_composition_barrett check
  test_command: make check
  full_path_benchmark_command: unavailable_until_full_Forward_integration
  benchmark_metric: cycles
  lower_is_better: true
