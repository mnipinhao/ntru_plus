  inputs:
    - symbolic Q<f0>, Q<f1>, Q<f2>, Q<f3>, Q<f4>, Q<f5>, Q<f6>, Q<f7>, Q<f8>, Q<roots>, Q<modq>
  outputs:
    - symbolic Q<out0>, Q<out1>, Q<out2>, Q<out3>, Q<out4>, Q<out5>, Q<out6>, Q<out7>, Q<out8>
  clobbers:
