mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: gt864_forward_ntt9_complete_core
  name: GT864 Forward complete paper-oriented NTT9 core
  source: gt864_forward_ntt9_core.sym.S
  scheme: NTRU+864
  operation: complete correlation-safe two-level radix-3 NTT9 over nine already-twisted vectors

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_proxy_pi5_validation_required
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: RA-only allocation over 102 real instructions followed by real-instruction split-window scheduling
  driver: optimize.py
  expected_outputs:
    - build/gt864_forward_ntt9_core.n1.alloc.S
    - build/gt864_forward_ntt9_core.n1.opt.S
    - build/gt864_forward_ntt9_core.n1.log
  returned_outputs:
    - slothy-output/gt864_forward_ntt9_core.n1.alloc.S
    - slothy-output/gt864_forward_ntt9_core.n1.opt.S
    - slothy-output/gt864_forward_ntt9_core.n1.log
  allow_spills: false

region:
  start_label: gt864_forward_ntt9_core_slothy_start
  end_label: gt864_forward_ntt9_core_slothy_end
  expected_instruction_count: 102
  live_in:
    - Q<f0>
    - Q<f1>
    - Q<f2>
    - Q<f3>
    - Q<f4>
    - Q<f5>
    - Q<f6>
    - Q<f7>
    - Q<f8>
    - Q<roots> packs rho/rho-prime/rho2/rho2-prime/eta/eta-prime/eta-inverse/eta-inverse-prime
    - Q<modq> contains 3457 in every halfword
    - nine reserved vector registers model the untouched other column block
  live_out:
    - Q<out0>
    - Q<out1>
    - Q<out2>
    - Q<out3>
    - Q<out4>
    - Q<out5>
    - Q<out6>
    - Q<out7>
    - Q<out8>
    - nine reserved other-block vectors are unchanged

