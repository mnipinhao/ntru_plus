instruction_dag:
  file: gt864_forward_ntt9_level1.sym.S
  summary: three independent 15-instruction M5G two-product B3 DAGs with shared read-only roots and modulus

layout:
  input_representation: nine signed-int16 vectors f0 through f8 across eight public columns
  output_representation: three B3 result triples A, B, C in paper-oriented level-1 order
  vector_lanes: eight independent signed int16 lanes
  packing: roots lanes are rho, rho-prime, rho2, rho2-prime

memory_contract:
  loads:
    - none_register_only_region
  stores:
    - none_register_only_region
  aliasing: register-only region
  alignment: not_applicable_inside_region
  public_offsets_only: true
  pointer_updates: []

constant_contract:
  constants:
    - Q<roots>.h[0]=rho
    - Q<roots>.h[1]=round(rho*2^15/3457)
    - Q<roots>.h[2]=rho2
    - Q<roots>.h[3]=round(rho2*2^15/3457)
    - Q<modq>=3457 in every halfword
  modulus: 3457
  representation: normal R0 coefficients and normal fixed constants
  reduction_method: Algorithm-10 mul/sqrdmulh/mls fixed Barrett

range_contract:
  input_ranges:
    - exact per-position intervals come from M5G after NTT16 and twist
  intermediate_ranges:
    - prove_level1.py imports the complete correlation-aware M5G DAG
    - maximum exact level-1 node magnitude is 16816
  output_ranges:
    - union across all level-1 outputs is [-16816,16816]
  narrowing_points: []

constant_time_contract:
  secret_inputs:
    - coefficient vectors Q<f0> through Q<f8>
  public_inputs:
    - packed roots, modulus, and fixed region shape
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -C ../gt_forward_composition_barrett check
  test_command: make check
  full_path_benchmark_command: unavailable_until_full_Forward_integration
  benchmark_metric: cycles
  lower_is_better: true
