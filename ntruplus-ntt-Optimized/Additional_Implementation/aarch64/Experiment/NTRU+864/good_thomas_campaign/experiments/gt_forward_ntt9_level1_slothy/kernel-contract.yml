mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: gt864_forward_ntt9_level1_triplet
  name: GT864 Forward complete oriented NTT9 level-1 triplet
  source: gt864_forward_ntt9_level1.sym.S
  scheme: NTRU+864
  operation: three independent correlation-safe B3 butterflies over nine already-twisted vectors

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_proxy_pi5_validation_required
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: combined allocation and scheduling over 45 real instructions
  driver: optimize.py
  expected_outputs:
    - build/gt864_forward_ntt9_level1.n1.opt.S
    - build/gt864_forward_ntt9_level1.n1.log
  returned_outputs:
    - slothy-output/gt864_forward_ntt9_level1.n1.opt.S
    - slothy-output/gt864_forward_ntt9_level1.n1.log
  allow_spills: false

region:
  start_label: gt864_forward_ntt9_level1_slothy_start
  end_label: gt864_forward_ntt9_level1_slothy_end
  expected_instruction_count: 45
  live_in:
    - Q<f0> through Q<f8> are one already-twisted NTT9 column block
    - Q<roots> packs rho/rho-prime/rho2/rho2-prime
    - Q<modq> contains 3457 in every halfword
    - nine reserved vector registers model the untouched other column block
  live_out:
    - Q<a0>, Q<a1>, Q<a2> are B3(f0,f3,f6)
    - Q<b0>, Q<b1>, Q<b2> are B3(f1,f4,f7)
    - Q<c0>, Q<c1>, Q<c2> are B3(f8,f2,f5)
    - nine reserved other-block vectors are unchanged

abi:
  inputs:
    - symbolic Q<f0> through Q<f8>, Q<roots>, Q<modq>
  outputs:
    - symbolic Q<a0>, Q<a1>, Q<a2>, Q<b0>, Q<b1>, Q<b2>, Q<c0>, Q<c1>, Q<c2>
  clobbers:
    - SSA-named saved values, quotient estimates, fixed products, sums, and partials
  concrete_gprs_allowed:
    - none_register_only_region
  fixed_vector_registers: []
  reserved_registers:
