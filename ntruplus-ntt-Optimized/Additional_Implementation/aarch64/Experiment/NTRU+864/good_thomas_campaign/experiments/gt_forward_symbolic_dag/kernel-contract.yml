instruction_dag:
  file: instruction-dag.yml
  summary: >
    Fifteen instructions preserve a with an explicit ORR copy, form y0, perform exactly two
    mul/sqrdmulh/mls fixed products, form y1, then derive y2 as
    (a-y0)+(a-y1)+a. The rejected 3a intermediate is absent.

layout:
  input_representation: three signed-int16 row vectors across eight public columns
  output_representation: y0, y1, y2 in the same three symbolic vector names
  vector_lanes: eight independent signed int16 lanes
  packing: roots lanes are rho, rho-prime, rho2, rho2-prime followed by unused public lanes

memory_contract:
  loads:
    - none_register_only_region
  stores:
    - none_register_only_region
  aliasing: register-only region
  alignment: not_applicable_inside_region
  public_offsets_only: true
  pointer_updates: []

constant_contract:
  constants:
    - Q<roots>.h[0]=rho
    - Q<roots>.h[1]=round(rho*2^15/3457)
    - Q<roots>.h[2]=rho2
    - Q<roots>.h[3]=round(rho2*2^15/3457)
    - Q<modq>=3457 in every halfword
  modulus: 3457
  representation: normal R0 coefficients and normal fixed constants
  reduction_method: Algorithm-10 mul/sqrdmulh/mls fixed Barrett

range_contract:
  input_ranges:
    - exact Forward B3 input union is [-16816,16816]
    - per-instantiation asymmetric intervals are emitted by prove_exact_dag.py
  intermediate_ranges:
    - every mul/sqrdmulh/mls result is signed16; exhaustive fixed maximum is 3436
    - every exact-DAG add/sub is signed16
    - maximum exact-DAG node magnitude is 28568
  output_ranges:
    - union across all Forward B3 outputs is [-28568,28565]
  narrowing_points: []

constant_time_contract:
  secret_inputs:
    - coefficient vectors Q<a>, Q<b>, Q<c>
  public_inputs:
    - packed roots and modulus
    - fixed region shape
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -C ../gt_forward_composition_barrett check
  test_command: make check
  full_path_benchmark_command: unavailable_until_full_Forward_integration
  benchmark_metric: cycles
  lower_is_better: true
