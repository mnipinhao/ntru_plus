mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: gt864_forward_b3_two_product
  name: GT864 Forward correlation-safe two-product B3 symbolic region
  source: gt864_forward_b3_two_product.sym.S
  scheme: NTRU+864
  operation: one in-place oriented radix-3 butterfly under full NTT9 live-through pressure

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_proxy_pi5_validation_required
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: allocate-and-optimize symbolic region; fixed-register scheduling follows only after a returned allocation
  driver: optimize.py
  expected_outputs:
    - build/gt864_forward_b3_two_product.n1.opt.S
    - build/gt864_forward_b3_two_product.n1.log
  allow_spills: false

region:
  start_label: gt864_forward_b3_slothy_start
  end_label: gt864_forward_b3_slothy_end
  expected_instruction_count: 15
  live_in:
    - Q<a> B3 input a
    - Q<b> B3 input b
    - Q<c> B3 input c
    - Q<roots> packed rho/rho-prime/rho2/rho2-prime constants
    - Q<modq> modulus 3457 in every halfword
    - fifteen reserved live-through data vectors model the other current and future NTT9 states
  live_out:
    - Q<a> overwritten with y0
    - Q<b> overwritten with y1
    - Q<c> overwritten with y2
    - fifteen reserved live-through data vectors unchanged

abi:
  inputs:
    - symbolic Q<a>, Q<b>, Q<c>, Q<roots>, Q<modq>
  outputs:
    - symbolic Q<a>=y0, Q<b>=y1, Q<c>=y2
  clobbers:
    - symbolic Q<saved_a>
    - symbolic Q<quotient>
  concrete_gprs_allowed:
    - none_register_only_region
  fixed_vector_registers: []
  reserved_registers:
    - sp
    - x0
    - x1
    - x2
    - x3
    - x4
    - x5
    - x6
    - x7
    - x8
