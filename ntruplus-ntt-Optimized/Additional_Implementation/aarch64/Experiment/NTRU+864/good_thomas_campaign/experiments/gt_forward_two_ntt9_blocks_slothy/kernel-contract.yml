instruction_dag:
  file: instruction-dag.yml
  summary: M5J first-block handoff followed by a fixed-v16 capture, eight second-block Algorithm-10 twists, and a second complete M5I NTT9

layout:
  input_representation: sixteen NTT16 column vectors with s0..s7 in lanes plus tail0 and fixed-v16 s8 vectors
  producer_main: Q<cN>.h[s] is NTT16 output at column N and row-coordinate s for N=0..15 and s=0..7
  producer_tail: Q<tail0>.h[lane] and fixed v16.h[lane] are row-coordinate s=8 for columns lane and 8+lane
  first_consumer: row vectors cover columns 0 through 7 and produce Q<out0> through Q<out8>
  second_consumer: row vectors cover columns 8 through 15 and produce Q<out9> through Q<out17>
  output_representation: two paper-oriented NTT9 blocks covering all sixteen columns
  vector_lanes: eight independent signed int16 columns per block

memory_contract:
  loads:
    - thirty-two sequential 16-byte public twist-constant loads from x3
  stores:
    - none
  coefficient_loads_or_stores: none
  public_table_bytes: 512
  aliasing: twist tables are read-only and disjoint from coefficients
  alignment: x3 is 16-byte aligned
  public_offsets_only: true
  pointer_updates:
    - x3 advances by 16 bytes after each load, 512 bytes total

constant_contract:
  constants:
    - Q<roots>.h[0..7]=rho,rho-prime,rho2,rho2-prime,eta,eta-prime,eta-inverse,eta-inverse-prime
    - Q<modq>=3457 in every halfword
    - for each block and s=1..8 the table stores b_s[8] followed by bprime_s[8]
    - b_s[lane]=theta^((residue+6*column)*s) centered modulo 3457
    - bprime_s[lane]=round(b_s[lane]*2^15/3457)
  modulus: 3457
  representation: normal R0 coefficients and normal fixed constants
  reduction_method: Algorithm-10 mul/sqrdmulh/mls fixed Barrett

range_contract:
  input_ranges:
    - exact NTT16 producer intervals from M5G, maximum magnitude 9342
  intermediate_ranges:
    - transpose and fixed-v16 capture preserve exact values
    - every twist output has magnitude at most 3436
    - each complete correlation-aware NTT9 core has maximum magnitude 28568
    - first-block outputs are unchanged while the second block is consumed
  output_ranges:
    - both transformed block unions are within [-28568,28565]
  narrowing_points: []

constant_time_contract:
  secret_inputs:
    - coefficient vectors Q<c0> through Q<c15>, Q<tail0>, and fixed v16
  public_inputs:
    - roots, modulus, public twist tables, fixed instruction sequence
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -C ../gt_forward_composition_barrett check
  test_command: make check
  full_path_benchmark_command: unavailable_until_full_Forward_integration
  benchmark_metric: cycles
  lower_is_better: true
