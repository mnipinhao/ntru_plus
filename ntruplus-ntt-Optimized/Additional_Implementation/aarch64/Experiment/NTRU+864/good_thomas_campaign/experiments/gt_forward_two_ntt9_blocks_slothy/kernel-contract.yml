mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: gt864_forward_two_ntt9_blocks
  name: GT864 complete two-block NTT16-column to oriented-NTT9 region
  source: gt864_forward_two_ntt9_blocks.sym.S
  scheme: NTRU+864
  operation: transpose two NTT16 column blocks, lane-twist and consume both with complete paper-oriented NTT9 while preserving the first nine outputs through the second consumer

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_proxy_pi5_validation_required
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: RA-only allocation over 333 real instructions followed by real-instruction split-window scheduling
  driver: optimize.py
  expected_outputs:
    - build/gt864_forward_two_ntt9_blocks.n1.alloc.S
    - build/gt864_forward_two_ntt9_blocks.n1.opt.S
    - build/gt864_forward_two_ntt9_blocks.n1.log
  allow_spills: false

