kernel_id: ntruplus864-current-forward-ntt
scheme_id: ntruplus
parameter_set: NTRU+864
status: reconstructed-baseline-dag-not-a-good-thomas-contract

math_contract:
  operation: coefficient polynomial to 288 cubic base-ring elements
  ring: Z_3457[x]/(x^864-x^432+1)
  input_representation: natural coefficient order
  output_representation: eight-leaf SoA tiles consumed by Neon cubic base operations
  coefficient_bounds_before: caller-dependent-and-not-yet-fully-recorded
  coefficient_bounds_after: centered/bounded-current-contract-needs-exact-proof
  exact_or_rounded: exact modulo 3457

dependencies:
  - special ring-specific radix-2 layer over coefficient halves
  - radix-3 layer at step 144
  - radix-3 layer at step 48
  - radix-2 layer at step 24
  - radix-2 layer at step 12
  - radix-2 layer at step 6
  - radix-2 layer at step 3
  - store 36 SoA tiles; each tile holds j0[8], j1[8], j2[8]

dataflow:
  inputs:
    - 864 int16 coefficient representatives
  outputs:
    - 288 leaves in 36 physical SoA tiles of 24 int16 coefficients
  live_ins:
    - source pointer
    - destination pointer
    - public zeta table
  live_outs:
    - current NTT-domain polynomial
  temporaries:
    - butterfly values
    - Montgomery reduction intermediates
    - Barrett reduction intermediates

constants:
  zetas:
    - 288-entry Montgomery-form table in reference ntt.c
    - packed forward table in aarch64 asm/ntt.s
  modulus_constants:
    - q=3457
    - R=2^16 mod q
    - omega and inverse scaling constants from reference ntt.c
  decomposition_constants: []
  representation: mixed plain and Montgomery factors as documented by reference operations

memory:
  loads:
    - coefficient input
    - public packed zeta/constants tables
  stores:
    - intermediate destination used between assembly phase groups
    - final cubic-block destination
  alignment: poly is 16-byte aligned
  aliasing: public API permits in-place use and must be tested
  public_offsets_only: true

consumer_abi:
  physical_leaf: "leaf=8*group+lane"
  coefficient_offsets: "24*group + 8*j + lane"
  basemul_loads: "three consecutive q registers for j=0,1,2"
  basemuladd_addend: same three-register SoA tile
  zeta_lane: "zetas_mul[group][lane] labels the same leaf"
  logical_map_gate: experiments/gt_layout_consumer_abi_gate

forbidden:
  - secret_dependent_branch
  - secret_dependent_memory_access
  - changing_zeta_order_without-a-new-representation-proof
  - changing_representative_convention
  - changing_math_contract_without_dag_update

validation:
  reference_function: ntruplus-ntt-Optimized/Reference_Implementation/NTRU+864/ntt.c:ntt
  boundary_tests: to-be-created-in-phase-1
  differential_tests: current-asm-versus-reference-plus-future-stage-oracle
  range_proof: unresolved
  constant_time_review: required
