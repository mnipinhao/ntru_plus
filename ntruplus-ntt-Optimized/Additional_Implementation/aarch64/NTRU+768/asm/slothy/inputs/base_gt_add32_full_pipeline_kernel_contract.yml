mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: base_gt_add32_full_pipeline
  name: GT basemul_add32 full pipeline one-stripe prototype
  source: base_gt_add32_full_pipeline.sym.S
  scheme: NTRU+768
  operation: GT quartic product plus add32 finalization for one eight-lane stripe

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1_pi5_probe
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: allocate-and-optimize
  driver: base_gt_add32_full_pipeline_optimize.py --target n1
  expected_outputs: [../production/base_gt_add32_full_pipeline.n1.opt.S]
  allow_spills: false

region:
  start_label: slothy_start_base_gt_add32_full_pipeline
  end_label: slothy_end_base_gt_add32_full_pipeline
  expected_instruction_count: 115
  live_in:
    - x0 dst pointer
    - x1 src1 block-major pointer
    - x2 src2 block-major pointer
    - x3 src3 addend block-major pointer
    - x4 lambda pointer
    - x5 constants pointer
  live_out:
    - memory at old x0 contains the st4 block-major result
    - x0, x1, x2, x3, and x4 are post-incremented

abi:
  inputs:
    - x0 dst
    - x1 src1
    - x2 src2
    - x3 src3
    - x4 lambda
    - x5 constants
  outputs:
    - dst memory
    - post-incremented public pointers x0, x1, x2, x3, x4
  clobbers:
    - Slothy-allocated vector temporaries
  concrete_gprs_allowed: [x0, x1, x2, x3, x4, x5, sp]
  fixed_vector_registers: []
  reserved_registers:
    - x6
    - x7
    - x8
    - x9
    - x10
    - x11
    - x12
    - x13
    - x14
    - x15
    - x16
    - x17
    - x18
    - x19
    - x20
    - x21
    - x22
    - x23
    - x24
    - x25
    - x26
    - x27
    - x28
    - x29
    - x30
    - sp

instruction_dag:
  file: base_gt_add32_full_pipeline_instruction_dag.yml
  summary: load const/lambda/a/b/c, reduce wraparound high terms, form four quartic coefficients, add c through R^-1 add32 finalizer, st4 block-major output

layout:
  input_representation: block-major GT quartic blocks, ld4 yields coefficient vectors a0..a3, b0..b3, c0..c3 for eight physical quartics
  output_representation: same block-major layout, st4 writes out0..out3 interleaved by quartic lane
  vector_lanes: eight independent physical quartic blocks per int16x8 vector
  packing: AoS in memory, SoA in registers after ld4 and before st4

memory_contract:
  loads:
    - ldr Q<const> from x5
    - ldr Q<lam> from x4 with public post-increment
    - ld4 a0..a3 from x1 with public post-increment
    - ld4 b0..b3 from x2 with public post-increment
    - ld4 c0..c3 from x3 with public post-increment
  stores:
    - st4 out0..out3 to x0 with public post-increment
  aliasing: standalone prototype assumes x0 does not overlap x1, x2, or x3
  alignment: 16-byte alignment expected for all memory operands
  public_offsets_only: true
  pointer_updates:
    - x0 += 64
    - x1 += 64
    - x2 += 64
    - x3 += 64
    - x4 += 16

constant_contract:
  constants:
    - const.h[0] = q = 3457
    - const.h[2] = -qinv = -12929
    - const.h[3] = R = -147
    - const.h[7] = R^2 = 867
    - lam = gt_rowbitrev_lambda[branch][physical_j..physical_j+7]
  modulus: 3457
  representation: lambda is Montgomery-form; internal raw product after the second Montgomery stage is R^-1 and finalizer converts c plus product back to R^0
  reduction_method: Montgomery fold by uzp1, multiply by -qinv, smlal q, then uzp2

range_contract:
  input_ranges:
    - KEM small-input NTT output contract from gt_production_opt
    - addend c is signed int16 bounded normal representative
  intermediate_ranges:
    - lambda wraparound sums are immediately Montgomery-reduced before feeding the low coefficients
    - final raw_rminus1 lanes are signed int16 reduced residues
    - add32 prefinal lane uses int32 c * R + raw_rminus1 * R^2
  output_ranges:
    - signed int16 representative congruent to c + a*b modulo q
  narrowing_points:
    - first wraparound fold for a3*b3
    - first wraparound fold for a2*b3 + a3*b2
    - first wraparound fold for a1*b3 + a2*b2 + a3*b1
    - final product folds for r0, r1, r2, r3
    - add32 final folds for out0, out1, out2, out3

constant_time_contract:
  secret_inputs:
    - a coefficient lanes
    - b coefficient lanes
    - c coefficient lanes
  public_inputs:
    - public table offsets
    - fixed constants
    - loop counter outside this one-stripe prototype
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make test_gt_basemul_add32_asm
  test_command: build prototype wrapper after Slothy output is generated
  full_path_benchmark_command: make test_gt_basemul_add32_asm after production opt-in wiring
  benchmark_metric: ticks
  lower_is_better: true
