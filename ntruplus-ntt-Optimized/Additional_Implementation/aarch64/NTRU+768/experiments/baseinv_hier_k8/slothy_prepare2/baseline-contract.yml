memory_contract:
  loads:
    - 192 source bytes as three ld4 quartic blocks
    - 48 lambda bytes as three int16x8 vectors
  stores:
    - 192 numerator bytes as three st4 quartic blocks
    - 48 denominator bytes
    - 16 c01 bytes
    - 16 group-product bytes
  aliasing: source and lambda do not alias numerator, denominator, c01, or group-product outputs; output regions are pairwise disjoint
  alignment: all pointers are 16-byte aligned
  public_offsets_only: true
  pointer_updates:
    - x0 plus 192
    - x1 plus 48
    - x2 plus 16
    - x3 plus 16
    - x4 plus 192
    - x5 plus 48

constant_contract:
  constants:
    - v0.h[0] is q equals 3457
    - v0.h[2] is qinv equals -12929
  modulus: 3457
  representation: signed int16 Montgomery-domain representatives using R equals 2^16 modulo q
  reduction_method: smull or smlal accumulation followed by low-half qinv Montgomery reduction and uzp2 narrowing

range_contract:
  input_ranges:
    - source and lambda lanes satisfy the existing GT baseinv signed-int16 precondition
  intermediate_ranges:
    - products and sums use the same int32 widening operations as the baseline and do not overflow int32 under the existing contract
  output_ranges:
    - exact int16 representatives must match the baseline prepare2 group
  narrowing_points:
    - each Montgomery reduction narrows only through uzp2 after adding low-half times q

constant_time_contract:
  secret_inputs:
    - source coefficient lanes
  public_inputs:
    - fixed group count and fixed sequential offsets
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

