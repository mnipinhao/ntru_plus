dag:
  id: ntt768_gt_frontend_mul3_input_fusion_dag
  kernel_contract: kernel-contract.yml
  description: Per-iteration GT frontend input fusion DAG for poly_ntt_mul3_reference and poly_ntt_mul3_add1_reference.

inputs:
  - id: in_low_0_1
    source: x1 plus public offsets 0 and 16
  - id: in_low_2_3
    source: x1 plus public offsets 256 and 272
  - id: in_low_4_5
    source: x1 plus public offsets 512 and 528
  - id: in_high_0_1
    source: x1 plus public offsets 768 and 784
  - id: in_high_2_3
    source: x1 plus public offsets 1024 and 1040
  - id: in_high_4_5
    source: x1 plus public offsets 1280 and 1296
  - id: twist_pairs
    source: x3 public twist table post-increment stream

constants:
  - id: q
    register: v0.h0
  - id: branch_twist_constants
    register: v0.h4 and v0.h5
  - id: dft3_constants
    register: v0.h2 and v0.h3
  - id: add1_e0
    value: vector with lane0=1 and other lanes=0, add1 iter0 only, loaded from x7

nodes:
  - id: load_inputs
    op: public_offset_vector_loads
    inputs: [x1]
    outputs: [low_vectors, high_vectors]
    instruction_shape: ldp/ldr q registers from x1 public offsets
    tied_operands: []
    range_before: cbd1 small signed coefficients
    range_after: unchanged loaded coefficients
    may_reorder_with: [twist_loads, independent_scale_by_3]
    must_precede: [scale_by_3]
  - id: scale_by_3
    op: lane_local_add_add
    inputs: [low_vectors, high_vectors]
    outputs: [mul3_low_vectors, mul3_high_vectors]
    instruction_shape: add tmp, src, src; add dst, tmp, src
    tied_operands: []
    range_before: cbd1 small signed coefficients
    range_after: 3 times input coefficient, no narrowing
    may_reorder_with: [twist_loads, independent_twist_products]
    must_precede: [branch_twist, low_high_merge]
  - id: add_e0
    op: add_lane0_constant
    inputs: [mul3_low_vectors, add1_e0]
    outputs: [add1_low_vectors]
    instruction_shape: ldr q mask from x7; add into first low vector
    tied_operands: []
    range_before: mul3_low_vectors
    range_after: lane0 plus one for add1 symbol only
    may_reorder_with: []
    must_precede: [low_high_merge]
  - id: branch_twist
    op: known_factor_reduce_high_side
    inputs: [mul3_high_vectors, branch_twist_constants, q]
    outputs: [twisted_high_vectors, twist_correction_vectors]
    instruction_shape: mul/sqrdmulh/mls/sub sequence identical to production
    tied_operands: []
    range_before: 3 times input coefficients
    range_after: production-equivalent branch-twisted values
    may_reorder_with: [load_inputs, scale_by_3, twist_loads]
    must_precede: [low_high_merge]
  - id: low_high_merge
    op: branch_sum_difference
    inputs: [mul3_or_add1_low_vectors, twisted_high_vectors, twist_correction_vectors]
    outputs: [branch0_branch1_vectors]
    instruction_shape: add/sub sequence identical to production
    tied_operands: []
    range_before: production-equivalent inputs after applying poly_mul3 in source domain
    range_after: production-equivalent branch vectors
    may_reorder_with: [twist_loads]
    must_precede: [twist_multiply_vectors]
  - id: twist_multiply_vectors
    op: vector_order_twiddle_multiply
    inputs: [branch0_branch1_vectors, twist_pairs, q]
    outputs: [twiddled_vectors]
    instruction_shape: 12 ldp q1,q2 plus sqrdmulh/mul/mls
    tied_operands: []
    range_before: production-equivalent branch vectors
    range_after: production-equivalent twiddled vectors
    may_reorder_with: [independent_twiddle_multiplies]
    must_precede: [zip_blocks]
  - id: zip_blocks
    op: good_thomas_block_interleave
    inputs: [twiddled_vectors]
    outputs: [zip_vectors]
    instruction_shape: zip1/zip2 .2d
    tied_operands: []
    range_before: production-equivalent twiddled vectors
    range_after: production-equivalent row vectors
    may_reorder_with: [independent_dft3_groups]
    must_precede: [dft3_groups]
  - id: dft3_groups
    op: row_dft3
    inputs: [zip_vectors, dft3_constants, q]
    outputs: [row0_values, row1_values, row2_values]
    instruction_shape: add/sub plus sqrdmulh/mul/mls exactly matching production DFT3
    tied_operands: []
    range_before: production-equivalent row vectors
    range_after: production-equivalent row scratch values
    may_reorder_with: [independent_dft3_groups]
    must_precede: [scratch_stores]
  - id: scratch_stores
    op: public_offset_row_scratch_store
    inputs: [row0_values, row1_values, row2_values]
    outputs: [row0_scratch, row1_scratch, row2_scratch]
    instruction_shape: str q to x4/x5/x6 public offsets; update x1/x4/x5/x6
    tied_operands: []
    range_before: production-equivalent row scratch values
    range_after: memory stores consumed by production _gt_ntt32_batch8_to_blockmajor
    may_reorder_with: [independent_store_groups_after_values_ready]
    must_precede: []

memory:
  loads:
    - 12 public input loads from x1 per iteration
    - 12 public twist pair loads from x3 per iteration
    - 1 add1 e0-mask load from x7 in add1 iter0 only
  stores:
    - 12 row scratch stores to x4/x5/x6 per iteration
  ordering_constraints:
    - input loads must precede their scale_by_3 users
    - stores must occur after their DFT3 value producers
    - pointer post-increments must preserve production end-of-iteration pointer state

outputs:
  - row0_scratch
  - row1_scratch
  - row2_scratch
  - updated x1/x3/x4/x5/x6

live_out:
  - x1
  - x3
  - x4
  - x5
  - x6
  - row scratch memory

review:
  all_outputs_traced: true
  tied_operands_checked: true
  memory_order_checked: true
  ranges_checked: true
