mode: new_symbolic_kernel
candidate_status: investigate

kernel:
  id: ntt768_gt_frontend_mul3
  name: ntt768_gt_frontend_mul3
  source: experiments/keygen_sample_ntt_fusion/gt_frontend_mul3/ntt768_gt_frontend_mul3.sym.S
  scheme: ntruplus768_gt
  operation: keygen_sample_mul3_then_ntt768_gt_frontend

target:
  arch: aarch64_neon
  microarchitecture: neoverse_n1
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: split-heuristic-per-gt-frontend-iteration
  driver: experiments/keygen_sample_ntt_fusion/gt_frontend_mul3/optimize_ntt768_gt_frontend_mul3.py
  expected_outputs:
    - asm/gt/ntt/ntt768_gt_frontend_mul3.n1.opt.inc
    - asm/gt/ntt/ntt768_gt_frontend_mul3_add1.n1.opt.inc
  allow_spills: false

region:
  start_label: slothy_start_ntt768_gt_frontend_iter0
  end_label: slothy_end_ntt768_gt_frontend_iter0
  expected_instruction_count: 184
  live_in:
    - x1 source pointer at current GT frontend iteration
    - x3 public twist pointer
    - x4 row0 scratch pointer
    - x5 row1 scratch pointer
    - x6 row2 scratch pointer
    - x7 add1 e0 mask pointer, add1 variant only
    - v0 q/reduction/DFT3 constant vector
  live_out:
    - x1 advanced by 32 bytes per iteration
    - x3 advanced by public twist table consumption
    - x4 advanced by 64 bytes per iteration
    - x5 advanced by 64 bytes per iteration
    - x6 advanced by 64 bytes per iteration
    - row0/row1/row2 scratch stores matching the production GT frontend contract

