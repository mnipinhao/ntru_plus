instruction_dag:
  file: experiments/keygen_sample_ntt_fusion/gt_frontend_mul3/instruction-dag.yml
  summary: Load 12 input vectors per iteration, compute 3*x lane-wise, load and add e0 for add1 iter0 only, then execute the unchanged branch twist, Good-Thomas frontend DFT3, and row scratch stores.

layout:
  input_representation: natural coefficient poly after cbd1, signed int16 small coefficients
  output_representation: production GT frontend row scratch for block-major row-bitrev forward NTT
  vector_lanes: 8 signed 16-bit coefficients per Neon vector
  packing: unchanged row0/row1/row2 scratch layout consumed by production _gt_ntt32_batch8_to_blockmajor

memory_contract:
  loads:
    - 12 public-offset q loads from x1 per GT frontend iteration
    - 12 public-order twist ldp loads from x3 per GT frontend iteration
  stores:
    - 12 q stores to row0/row1/row2 scratch per GT frontend iteration
  aliasing: input poly and row scratch do not overlap in benchmark wrapper
  alignment: input, twist table, and row scratch are 16-byte aligned
  public_offsets_only: true
  pointer_updates:
    - x1 += 32 per iteration
    - x3 post-increments through public twist table
    - x4 += 64 per iteration
    - x5 += 64 per iteration
    - x6 += 64 per iteration

constant_contract:
  constants:
    - v0.h0 q for mls reduction
    - v0.h2/v0.h3 DFT3 alpha reduction constants
    - v0.h4/v0.h5 branch twist reduction constants
    - experiment-local e0 mask vector for add1 iter0, loaded from x7
  modulus: 3457
  representation: signed int16 bounded residues with existing GT Montgomery-style twiddle reductions
  reduction_method: unchanged production sqrdmulh/mul/mls known-factor reductions

range_contract:
  input_ranges:
    - cbd1 sample coefficients are small signed values before triple scaling
    - triple variant input to GT frontend equals 3*a
    - add1 variant input to GT frontend equals 3*a plus one at coefficient 0
  intermediate_ranges:
    - scale-by-3 stays within signed int16 for cbd1 samples
    - subsequent branch twist and DFT3 ranges follow the production GT frontend after equivalent poly_mul3 input
  output_ranges:
    - row scratch values exactly match poly_triple plus poly_ntt reference row scratch modulo q and as final full NTT output
  narrowing_points:
    - no new narrowing instructions

constant_time_contract:
  secret_inputs:
    - sampled polynomial coefficients loaded from x1
  public_inputs:
    - fixed offsets
    - twist table order
    - add1 e0 mask address in x7 for add1 symbol only
    - add1 variant selector at build-time symbol level
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -f /tmp/sampledag.mk -B bench_gt_keygen_sample_ntt_fusion_slothy_pmu VARIANT=gt_production_default SUDO= CORE=3
  test_command: make -f /tmp/sampledag.mk -B bench_gt_keygen_sample_ntt_fusion_slothy_pmu VARIANT=gt_production_default SUDO= CORE=3
  full_path_benchmark_command: optional full keygen wrapper after local PMU is non-regressing
  benchmark_metric: cycles
  lower_is_better: true
