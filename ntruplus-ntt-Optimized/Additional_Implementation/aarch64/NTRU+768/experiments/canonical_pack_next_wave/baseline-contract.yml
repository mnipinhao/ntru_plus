mode: existing_region_replacement
baseline_status: extracted

baseline:
  id: gt_canonical_pack_chunk0_baseline
  source: asm/gt/support/poly_canonical_pack.S
  extracted_region: experiments/canonical_pack_next_wave/baseline-pack-chunk0.S
  function: poly_tobytes_gt_canonical
  start_label: canonical blocks 0 through 15 comment boundary
  end_label: canonical blocks 16 through 31 comment boundary
  source_commit: working-tree generated artifact sha256 91c4c974e766515a9b465dd4e83ee5745ce9daf3b9e207814e5ef4de54f3c569

kernel:
  id: gt_canonical_pack_chunk0_baseline
  name: GT canonical pack fixed-offset chunk 0
  source: experiments/canonical_pack_next_wave/baseline-pack-chunk0.S
  scheme: NTRU+768
  operation: gather 16 GT quartic blocks, canonicalize residues, pack 12-bit fields, and store 96 canonical bytes

target:
  arch: aarch64_neon
  microarchitecture: cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.neoverse_n1_experimental

slothy:
  workflow: optimize-existing-allocation
  driver: experiments/canonical_pack_next_wave/optimize_pack_chunk.py
  expected_outputs:
    - experiments/canonical_pack_next_wave/pack_chunk_p1.fixed.opt.s
    - experiments/canonical_pack_next_wave/pack_chunk_p2.fixed.opt.s
    - experiments/canonical_pack_next_wave/pack_chunk_p3.fixed.opt.s
  allow_spills: false

region:
  instruction_count: 112
  live_in:
    - x0 output byte pointer
    - x1 GT physical polynomial base
    - v0 eight lanes of q equals 3457
  live_out:
    - x0 advanced by 96 bytes
    - canonical byte blocks 0 through 15 stored
  clobbers:
    - v1-v31

abi:
  inputs:
    - x0 output byte pointer
    - x1 GT physical polynomial base
    - v0 modulus vector
  outputs:
    - x0 advanced by 96 bytes
    - 96 output bytes
  clobbers:
    - v1-v31
  concrete_gprs_allowed:
    - x0
    - x1
  fixed_vector_registers:
    - v0
  reserved_registers:
    - x2-x30
    - sp

instruction_dag:
  file: experiments/canonical_pack_next_wave/instruction-dag.yml
  summary: exact production gather, transpose, one-add-q normalization, and 12-bit packing DAG

layout:
  input_representation: GT physical quartic block-major order
  output_representation: KPQC canonical byte blocks 0 through 15
  vector_lanes: signed int16 before packing
  packing: four 12-bit quartic coefficients become six consecutive bytes

memory_contract:
  loads:
    - sixteen distinct 8-byte GT blocks selected by public fixed offsets
  stores:
    - 96 consecutive bytes through two post-increment st1 instructions
  aliasing: source polynomial and output byte buffer do not alias
  alignment: source is at least 8-byte aligned and output is at least byte aligned
  public_offsets_only: true
  pointer_updates: x0 advances by 96 and x1 is unchanged

constant_contract:
  constants:
    - q equals 3457 in every v0 halfword lane
  modulus: 3457
  representation: signed representative in the inclusive range -3457 through 3456
  reduction_method: add q exactly once when the sign bit is set

range_contract:
  input_ranges:
    - each int16 lane is between -3457 and 3456 inclusive
  intermediate_ranges:
    - normalized lanes are between 0 and 3456 inclusive
  output_ranges:
    - each encoded field is a canonical 12-bit residue between 0 and 3456
  narrowing_points:
    - 12-bit fields are interleaved into bytes without arithmetic narrowing

constant_time_contract:
  secret_inputs:
    - polynomial coefficient values
  public_inputs:
    - fixed permutation offsets
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make -B test_gt_canonical_pack_boundary
  test_command: make -B test_gt_canonical_pack_boundary
  full_path_benchmark_command: make -B bench_gt_canonical_pack_next_wave_pmu
  benchmark_metric: cycles
  lower_is_better: true

baseline_cost:
  static_instruction_count: 112
  slothy_expected_cycles: not yet measured as a combined chunk
  full_path_benchmark: pending Pi5 component profiler
  benchmark_command: make -B bench_gt_canonical_pack_next_wave_pmu
