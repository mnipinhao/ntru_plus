  - Contract comparison is intentionally not preserved because x4 row scratch loads become V<b0_q0>..V<b0_q7> live-ins.
  - This candidate is a pressure test for Stage12 to Stage345 fusion, not a drop-in production splice.
  - Remote host pinhao@172.25.166.141 -p 51208 became reachable on 2026-07-09.
  - Split-heuristic N1 run failed before scheduling because chunk live-out b0_q1/b0_q3 had ambiguous virtual output type.
