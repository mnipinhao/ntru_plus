candidate:
  id: ntt32_stage345_block0_livein_pressure
  status: investigate
  kernel_contract: experiments/forward_ntt_phase123_u01/stage345_block0_livein/kernel-contract.yml
  symbolic_source: experiments/forward_ntt_phase123_u01/stage345_block0_livein/candidate-stage345-block0-livein.sym.S
  slothy_driver: experiments/forward_ntt_phase123_u01/stage345_block0_livein/optimize_stage345_block0_livein.py

contract_preservation:
  preserved: false
  approved_changes:
    - Intentional pressure-test change: eight x4 row scratch q loads become Stage12 live-in vectors V<b0_q0>..V<b0_q7>.
    - Candidate is not promotable as a direct splice until a fused Stage12 producer provides those live-ins.

region:
  start_label: slothy_start_stage345_block0_livein
  end_label: slothy_end_stage345_block0_livein
  live_in:
    - V<b0_q0> through V<b0_q7> are Stage12 out0 Q0..Q7 for the current row block
    - x10 scatter pointer base for block0 output stores
    - x12 stage345 twiddle table pointer, consumed by four post-increment q loads
    - x14 public scatter wrap bound
    - sp stack frame with STACK_LOC_0 temporary spill slot
    - v0 fixed q/reduction constant vector
  live_out:
    - x10 post-region scatter pointer value
    - x12 advanced by 64 bytes after four q twiddle loads
    - memory stores to public scatter addresses derived from x10 and wrap logic

abi:
  inputs:
    - V<b0_q0> Stage12 stripe0 out0, production Q0
    - V<b0_q1> Stage12 stripe1 out0, production Q1
    - V<b0_q2> Stage12 stripe2 out0, production Q2
    - V<b0_q3> Stage12 stripe3 out0, production Q3
    - V<b0_q4> Stage12 stripe4 out0, production Q4
    - V<b0_q5> Stage12 stripe5 out0, production Q5
    - V<b0_q6> Stage12 stripe6 out0, production Q6
    - V<b0_q7> Stage12 stripe7 out0, production Q7
    - x10 production scatter pointer
    - x12 stage345 twiddle base
    - x14 scatter wrap bound
    - v0 q/reduction constants
  outputs:
    - x10 post-region scatter pointer value
    - x12 post-region twiddle pointer value
    - scatter memory stores
  clobbers:
    - x0-x17 public pointer temporaries used by production scatter scheduling
    - symbolic vector temporaries allocated by Slothy
  concrete_gprs_allowed:
    - x0
    - x1
    - x2
    - x3
    - x4
    - x5
    - x6
    - x7
    - x8
    - x9
    - x10
    - x11
    - x12
    - x13
    - x14
    - x15
    - x16
    - x17
    - sp
  fixed_vector_registers:
    - v0

memory_contract:
  loads:
    - four q twiddle loads from x12 with public post-increment offsets
    - STACK_LOC_0 spill/restore pairs if retained by Slothy model
  stores:
    - twenty-three public scatter stores preserving production addresses and low/high d-half placement
    - STACK_LOC_0 spill/restore pairs only if Slothy reproduces existing public scalar spill behavior
  aliasing: x12 read-only twiddle table and x10-derived scatter stores do not alias; Q0..Q7 are register live-ins from fused Stage12
  alignment: q twiddle loads are 16-byte aligned; d stores are 8-byte aligned within public scatter layout
  public_offsets_only: true

constant_contract:
  constants:
    - v0.h[0] q = 3457
    - v0.h[1] final stage reduction scaling constant
    - x12 table contains production stage345 twiddle vectors
  modulus: q = 3457
  representation: signed 16-bit Neon lanes, same lazy bounds as production NTT32 stage345
  reduction_method: production sqrdmulh/mls and sqdmulh/srshr/mls reduction sequences

range_contract:
  input_ranges:
    - V<b0_q0>..V<b0_q7> equal the exact values formerly loaded from x4 offsets 0..112 after Stage12
  intermediate_ranges:
    - same lazy stage345 intermediate bounds as production my_32ntt.opt.s
  output_ranges:
    - final d stores match production NTT32 stage345 block0 output representatives
  narrowing_points:
    - ext/str d pairs store low and high halves after production reduction sequences

constant_time_contract:
  secret_inputs:
    - polynomial coefficients contained in V<b0_q0>..V<b0_q7>
  public_inputs:
    - x10 scatter pointer base
    - x12 twiddle table base
    - x14 scatter wrap bound
    - all offsets and cmp/csel wrap conditions
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true
