instruction_dag:
  file: instruction-dag.yml
  summary: same Stage345 block0 arithmetic and scatter stores as production, but Q0..Q7 are live-in vectors instead of row scratch q loads

layout:
  input_representation: Stage12 out0 Q0..Q7 as live Neon vectors, one vector per Q index
  output_representation: unchanged production Stage345 block0 scatter d-store layout
  vector_lanes: 8 signed 16-bit coefficients per Neon vector
  packing: Q0..Q7 map to b0_q0..b0_q7, then follow production Stage345 block0 butterfly/reduction/scatter layout

memory_contract:
  loads:
    - four q twiddle loads from x12 with public post-increment offsets
    - STACK_LOC_0 spill/restore pairs if retained by Slothy model
  stores:
    - twenty-three public scatter stores preserving production addresses and low/high d-half placement
    - STACK_LOC_0 spill/restore pairs only if Slothy reproduces existing public scalar spill behavior
  aliasing: x12 read-only twiddle table and x10-derived scatter stores do not alias; Q0..Q7 are register live-ins from fused Stage12
  alignment: q twiddle loads are 16-byte aligned; d stores are 8-byte aligned within public scatter layout
  public_offsets_only: true
  pointer_updates:
    - x12 advances by 64 bytes through four q post-increment loads
    - scatter pointers use public add/cmp/sub/csel wrap logic unchanged from production

constant_contract:
  constants:
    - v0.h[0] q = 3457
    - v0.h[1] final stage reduction scaling constant
    - x12 table contains production stage345 twiddle vectors
  modulus: q = 3457
  representation: signed 16-bit Neon lanes, same lazy bounds as production NTT32 stage345
  reduction_method: production sqrdmulh/mls and sqdmulh/srshr/mls reduction sequences

range_contract:
  input_ranges:
    - V<b0_q0>..V<b0_q7> equal the exact values formerly loaded from x4 offsets 0..112 after Stage12
  intermediate_ranges:
    - same lazy stage345 intermediate bounds as production my_32ntt.opt.s
  output_ranges:
    - final d stores match production NTT32 stage345 block0 output representatives
  narrowing_points:
    - ext/str d pairs store low and high halves after production reduction sequences

constant_time_contract:
  secret_inputs:
    - polynomial coefficients contained in V<b0_q0>..V<b0_q7>
  public_inputs:
    - x10 scatter pointer base
    - x12 twiddle table base
    - x14 scatter wrap bound
    - all offsets and cmp/csel wrap conditions
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: not-run; this is a Slothy pressure test until paired with fused Stage12 producer
  test_command: python3 /Users/chenpinhao/.codex/skills/slothy-symbolic-asm-authoring/scripts/check-symbolic-asm.py --candidate --mode existing_region_replacement --kernel-contract experiments/forward_ntt_phase123_u01/stage345_block0_livein/kernel-contract.yml --baseline-contract experiments/forward_ntt_phase123_u01/stage345_block0_livein/baseline-contract.yml experiments/forward_ntt_phase123_u01/stage345_block0_livein/candidate-stage345-block0-livein.sym.S
  full_path_benchmark_command: not-run; candidate is not production-wired until Stage12 live-in producer exists
  benchmark_metric: cycles
  lower_is_better: true
