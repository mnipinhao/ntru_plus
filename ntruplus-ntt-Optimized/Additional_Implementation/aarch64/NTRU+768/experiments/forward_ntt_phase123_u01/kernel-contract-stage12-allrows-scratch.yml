instruction_dag:
  file: instruction-dag-stage12-allrows-scratch.yml
  summary: compute all-row U01 slots0+1 for Phase123 iterations 0/2/4/6, store raw Qs to compact x13 scratch, then run NTT32 stage12 stripes0+1 for rows0/1/2

layout:
  input_representation: original GT Phase123 input layout; selected even iterations are addressed by public byte offsets
  scratch_representation: compact stage12 consumption order at x13
  scratch_rows:
    row0: x13+0 Q0/Q1/Q8/Q9/Q16/Q17/Q24/Q25
    row1: x13+128 Q0/Q1/Q8/Q9/Q16/Q17/Q24/Q25
    row2: x13+256 Q0/Q1/Q8/Q9/Q16/Q17/Q24/Q25
  output_representation: per-row NTT32 post-stage12 row scratch layout for Q0/Q1/Q8/Q9/Q16/Q17/Q24/Q25
  vector_lanes: 8 signed 16-bit coefficients per Neon vector

memory_contract:
  loads:
    - input q loads from x1 offsets for iterations 0/2/4/6 and P0/P2/P4 low/high halves
    - Phase123 twist/precompute ldp q pairs from x7 plus fixed offsets 0/64/128/192/256/320
    - raw Q scratch reloads from x13 compact public offsets
    - NTT32 stage12 twiddle q loads from x12 offsets 16/32/48
  stores:
    - raw Q scratch stores to x13 compact public offsets
    - post-stage12 stores to x4/x5/x6 public fixed offsets
  aliasing: x1/x3/x12 read-only inputs must not alias x4/x5/x6/x13 stores during the region
  alignment: all q loads/stores and ldp q pairs are 16-byte aligned
  public_offsets_only: true

constant_contract:
  constants:
    - v0.h[0] q = 3457
    - v0.h[2] zeta3 normal multiplier
    - v0.h[3] zeta3 precompute
    - v0.h[4] Phase123 high-half multiplier
    - v0.h[5] Phase123 high-half precompute
    - x3 table contains production Phase123 twiddle/precompute q pairs
    - x12 table contains production NTT32 stage12 twiddle vectors
  modulus: q = 3457
  representation: signed 16-bit lane values with production Montgomery-style reductions
  reduction_method: same sqrdmulh/mls sequences as production Phase123 U01 and production NTT32 stage12

range_contract:
  input_ranges:
    - same as production GT Phase123 input contract
  intermediate_ranges:
    - all-row U01 outputs match production Phase123 slots0+1 for iterations 0/2/4/6
    - stage12 intermediates match production NTT32 lazy stage12 arithmetic
  output_ranges:
    - same as production NTT32 stage12 output for Q0/Q1/Q8/Q9/Q16/Q17/Q24/Q25

constant_time_contract:
  secret_inputs:
    - polynomial coefficients loaded from x1
  public_inputs:
    - all offsets
    - table bases x3 and x12
    - output bases x4/x5/x6
    - scratch base x13
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

