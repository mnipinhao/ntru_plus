dag:
  id: phase123_stage12_block0_first_allrows_dag
  kernel_contract: kernel-contract-stage12-block0-first.yml
  description: All Phase123 slice families feed row-major raw scratch, then NTT32 stage12 writes post-stage12 row-major scratch with Q0..Q7 ready for stage345 block0.

inputs:
  - id: input_base
    register: x1
    description: original Phase123 input base
  - id: twist_base
    register: x3
    description: Phase123 twist/precompute table base
  - id: ntt32_twiddle_base
    register: x12
    description: ntt32_twiddle_vecs base
  - id: scratch_base
    register: x13
    description: row-major raw and post-stage12 scratch
  - id: constants
    register: v0
    description: q and reduction constants

phase123_nodes:
  - id: even_u01
    op: phase123_u01_common_prefix_then_dft3_rows
    iterations: [0, 2, 4, 6]
    outputs: [Q0, Q1, Q8, Q9, Q16, Q17, Q24, Q25]
    stores: [x13 row0/row1/row2 row-major offsets]
    must_precede: [stage12_stripes0_1]
  - id: even_u23
    op: phase123_u23_common_prefix_then_dft3_rows
    iterations: [0, 2, 4, 6]
    outputs: [Q2, Q3, Q10, Q11, Q18, Q19, Q26, Q27]
    stores: [x13 row0/row1/row2 row-major offsets]
    must_precede: [stage12_stripes2_3]
  - id: odd_u01
    op: phase123_u01_common_prefix_then_dft3_rows
    iterations: [1, 3, 5, 7]
    outputs: [Q4, Q5, Q12, Q13, Q20, Q21, Q28, Q29]
    stores: [x13 row0/row1/row2 row-major offsets]
    must_precede: [stage12_stripes4_5]
  - id: odd_u23
    op: phase123_u23_common_prefix_then_dft3_rows
    iterations: [1, 3, 5, 7]
    outputs: [Q6, Q7, Q14, Q15, Q22, Q23, Q30, Q31]
    stores: [x13 row0/row1/row2 row-major offsets]
    must_precede: [stage12_stripes6_7]

stage12_nodes:
  - id: stage12_stripes0_7_rows0_2
    op: production_ntt32_stage12_stripe
    rows: [row0, row1, row2]
    stripes: [0, 1, 2, 3, 4, 5, 6, 7]
    inputs: [x13 raw Qs, x12 stage12 twiddles, v0 q]
    outputs:
      block0: [Q0, Q1, Q2, Q3, Q4, Q5, Q6, Q7]
      block1: [Q8, Q9, Q10, Q11, Q12, Q13, Q14, Q15]
      block2: [Q16, Q17, Q18, Q19, Q20, Q21, Q22, Q23]
      block3: [Q24, Q25, Q26, Q27, Q28, Q29, Q30, Q31]
    stores: [x13 row-major post-stage12 offsets]

block_first_contract:
  block0:
    source: out0/q22 from every stage12 stripe
    offsets: row_base + 16*0 through row_base + 16*7
    next_consumer: stage345 block0
  block1:
    source: out1/q23 from every stage12 stripe
    offsets: row_base + 16*8 through row_base + 16*15
  block2:
    source: out2/q26 from every stage12 stripe
    offsets: row_base + 16*16 through row_base + 16*23
  block3:
    source: out3/q27 from every stage12 stripe
    offsets: row_base + 16*24 through row_base + 16*31

memory:
  loads:
    - phase123 input and twist loads at fixed public offsets
    - stage12 raw q loads from x13 fixed public offsets
    - stage12 twiddle loads from x12 fixed public offsets
  stores:
    - raw Q stores to x13
    - post-stage12 stores to x13, overwriting raw Q after the corresponding stripe has loaded
  ordering_constraints:
    - each stage12 stripe must follow all raw stores for Q[s], Q[s+8], Q[s+16], Q[s+24]
    - post-stage12 store may overwrite raw Q only after that raw Q has been loaded
    - no secret-dependent memory addresses

outputs:
  - row0/row1/row2 post-stage12 Q0..Q31
  - row0/row1/row2 block0-ready Q0..Q7 for later stage345 block0 prototype

review:
  all_outputs_traced: true
  tied_operands_checked: true
  memory_order_checked: true
  ranges_checked: true
