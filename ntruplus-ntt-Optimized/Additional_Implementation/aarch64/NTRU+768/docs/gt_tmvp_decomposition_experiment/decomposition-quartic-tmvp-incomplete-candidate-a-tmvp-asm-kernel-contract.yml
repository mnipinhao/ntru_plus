mode: new_kernel_baseline_then_iterate
candidate_status: investigate

kernel:
  id: ntruplus768_gt_tmvp_incomplete_candidate_a_tmvp
  name: NTRUPlus768 incomplete Candidate A TMVP boundary
  source: docs/gt_soa_layout_experiment/kernels/ntruplus768_gt_tmvp_candidate_a_tmvp.sym.S
  scheme: ntruplus768
  operation: stage4_rowpack_tmvp_to_invntt_stage1_state

target:
  arch: aarch64_neon
  microarchitecture: raspberry_pi_5_cortex_a76
  slothy_arch_module: slothy.targets.aarch64.aarch64_neon
  slothy_target_module: slothy.targets.aarch64.cortex_a76

slothy:
  workflow: ra_then_window_opt
  driver: docs/gt_soa_layout_experiment/optimize_ntruplus768_gt_tmvp_candidate_a_tmvp.py
  expected_outputs: [docs/gt_soa_layout_experiment/kernels/ntruplus768_gt_tmvp_candidate_a_tmvp.opt.S]
  allow_spills: false

region:
  start_label: slothy_start_ntruplus768_gt_tmvp_candidate_a_tmvp
  end_label: slothy_end_ntruplus768_gt_tmvp_candidate_a_tmvp
  expected_instruction_count: 1
  live_in: [x0, x1, x2, x3]
  live_out: [memory_at_x0]

abi:
  inputs: [x0_output_rowpack, x1_a_stage4_rowpack, x2_b_stage4_rowpack, x3_c_stage4_rowpack_for_add_variant]
  outputs: [x0_output_rowpack_filled, w0_status_ok]
  clobbers: [x4, x5, x6, x7, x8, x9, x10, x11, x12, x13, x14, x15, x16, x17, v0-v31]
  concrete_gprs_allowed: [x0, x1, x2, x3, x4, x5, x6, x7, x8, x9, x10, x11, x12, x13, x14, x15, x16, x17]
  fixed_vector_registers: []
  reserved_registers: [x18, x19, x20, x21, x22, x23, x24, x25, x26, x27, x28, x29, x30, sp]

instruction_dag:
  file: docs/gt_tmvp_decomposition_experiment/decomposition-quartic-tmvp-incomplete-candidate-a-tmvp-asm-instruction-dag.yml
  summary: fuse_stage5_even_odd_pairs_then_compute_current_quartic_leaf_outputs_ce_plus_co_and_ce_minus_co

layout:
  input_representation: rowpack_stage4_branch_row_lane_k32_i16
  output_representation: rowpack_invntt_stage1_state_even_ce_plus_co_odd_ce_minus_co_i16
  vector_lanes: 8x16_bit_neon
  packing: branch_row_lane_k32_with_32_contiguous_k32_values_per_lane

memory_contract:
  loads: [a_stage4_768_i16_public_offsets, b_stage4_768_i16_public_offsets, c_stage4_768_i16_public_offsets_add_variant, public_twiddle_tables]
  stores: [r_768_i16_public_offsets]
  aliasing: output_may_not_alias_inputs_for_first_candidate
  alignment: 16_byte_preferred_unaligned_safe
  public_offsets_only: true
  pointer_updates: [none_escape_abi]

constant_contract:
  constants: [ntruplus_q_3457, montgomery_qinv_12929, ntruplus_rsq_867, stage5_ct_twiddles, gt_rowbitrev_lambda]
  modulus: 3457
  representation: signed_i16_montgomery_for_products_with_centered_modq_equivalence
  reduction_method: montgomery_reduce_after_quartic_products_and_stage5_materialization

range_contract:
  input_ranges: [stage4_inputs_observed_and_required_within_minus1728_to_1728]
  intermediate_ranges: [stage5_materialized_inputs_observed_within_minus3435_to_3435, quartic_products_use_i32_accumulators]
  output_ranges: [adapter_output_observed_within_minus3435_to_3435]
  narrowing_points: [after_montgomery_reduce_to_i16]

constant_time_contract:
  secret_inputs: [a_stage4_coefficients, b_stage4_coefficients, c_stage4_coefficients]
  public_inputs: [branch_index, row_index, lane_index, k32_index, table_offsets]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make test_gt_tmvp_quartic_tmvp_incomplete_candidate_a_tmvp_asm_skeleton_fullpath
  test_command: make test_gt_tmvp_quartic_tmvp_incomplete_candidate_a_tmvp_asm_skeleton_fullpath
  full_path_benchmark_command: make bench_gt_tmvp_quartic_tmvp_incomplete_candidate_a_tmvp_asm_skeleton_fullpath
  benchmark_metric: cntvct_ticks_per_call
  lower_is_better: true
