  end_label: slothy_end_ntruplus768_gt_tmvp_candidate_a_tmvp_batch8
  expected_instruction_count: 303
  live_in: [x0_output_batch_base, x1_a_stage4_batch_base, x2_b_stage4_batch_base, x3_candidate_a_batch_constants]
  live_out: [memory_at_x0_offsets_0_16_64_80_128_144_192_208]

abi:
  inputs: [x0_output_batch_base, x1_a_stage4_batch_base, x2_b_stage4_batch_base, x3_candidate_a_batch_constants]
