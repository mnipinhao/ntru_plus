instruction_dag:
  file: docs/gt_tmvp_decomposition_experiment/decomposition-quartic-tmvp-incomplete-candidate-a-tmvp-batch8-instruction-dag.yml
  summary: materialize_stage5_for_eight_pairs_then_compute_even_and_odd_quartic_products_and_store_ce_plus_co_ce_minus_co

layout:
  input_representation: rowpack_stage4_branch_row_kpair_batch_i16
  output_representation: rowpack_invntt_stage1_state_even_ce_plus_co_odd_ce_minus_co_i16
  vector_lanes: 8x16_bit_neon
  packing: four_quartic_lanes_separated_by_64_bytes_with_two_vectors_per_lane

memory_contract:
  loads: [a_stage4_batch_public_offsets, b_stage4_batch_public_offsets, constants_public_offsets]
  stores: [output_batch_public_offsets]
  aliasing: output_may_not_alias_inputs_for_first_candidate
  alignment: 16_byte_preferred_unaligned_safe
  public_offsets_only: true
  pointer_updates: [none_escape_abi]

constant_contract:
  constants: [ntruplus_q_3457, montgomery_qinv_minus12929, ntruplus_rsq_867, stage5_twiddle, stage5_twiddle_pre, lambda_even, lambda_odd]
  modulus: 3457
  representation: signed_i16_montgomery_for_products_with_centered_modq_equivalence
  reduction_method: montgomery_reduce_after_stage5_twiddle_products_quartic_products_and_final_rsq_normalization

range_contract:
  input_ranges: [stage4_inputs_observed_and_required_within_minus1728_to_1728]
  intermediate_ranges: [stage5_materialized_inputs_expected_within_minus3435_to_3435, quartic_products_use_i32_accumulators]
  output_ranges: [adapter_output_centered_i16_modq_equivalent]
  narrowing_points: [after_montgomery_reduce_to_i16]

constant_time_contract:
  secret_inputs: [a_stage4_values, b_stage4_values]
  public_inputs: [output_pointer, input_pointers, constants_pointer, branch_index, row_index, kpair_block_index]
  no_secret_dependent_branches: true
  no_secret_dependent_memory_access: true

validation:
  oracle_command: make test_gt_tmvp_quartic_tmvp_incomplete_candidate_a_true_forward_stage4_fullpath_asm
  test_command: make test_gt_tmvp_quartic_tmvp_incomplete_candidate_a_tmvp_batch8_symbolic_contract
  full_path_benchmark_command: make bench_gt_tmvp_quartic_tmvp_incomplete_candidate_a_tmvp_asm_skeleton_fullpath
  benchmark_metric: cntvct_ticks_per_call_after_public_wrapper_integration
  lower_is_better: true
