artifact: gt-forward-rowpack-output-contract
version: 1
scope:
  scheme: NTRU+768
  operation: Forward NTT output layout prototype and candidate validation
  production_symbols:
    - poly_ntt
    - _poly_ntt
  source_files:
    reference: ntt.c
    production_frontend: asm/my_ntt.s
    ntt32_kernel: asm/slothy/my_32ntt.opt.s
    rowpack_symbolic_source: asm/slothy/ntt32_v2_symbolic.s
    rowpack_candidate: asm/slothy/ntt32_8way.rowpack_v2.n1.opt.s
    rowpack_v3_symbolic_handoff: asm/slothy/ntt32_v3_rowpack_stage345_symbolic.s
  non_goals:
    - Do not promote the v2 candidate into production poly_ntt by default.
    - Do not change arithmetic, twiddle order, or reduction schedule.
    - Do not use rowpack oracle full-path cycles as production evidence.

current_layout:
  name: gt_rowbitrev_block_major
  description: >
    Current promoted GT Forward NTT output.  For each branch, physical block j
    stores four quartic lanes contiguously.
  index_formula: "block_index(branch, physical_j, lane) = branch*384 + 4*physical_j + lane"
  physical_j_domain: "0 <= physical_j < 96"
  lane_domain: "0 <= lane < 4"
  branch_domain: "0 <= branch < 2"
  basemul_lambda: "gt_rowbitrev_lambda[branch][physical_j]"

rowpack_target_layout:
  name: gt_rowpack_soa
  description: >
    Target transformed-domain layout for the rowpack basemul and InvNTT row
    kernel.  Each branch,row,lane plane stores k32=0..31 contiguously.
  physical_j_from_row_k32: "physical_j(row, k32) = (32*row + 3*k32) mod 96"
  row_from_physical_j: "row(physical_j) = 2*(physical_j mod 3) mod 3"
  index_formula: "rowpack_index(branch,row,lane,k32) = branch*384 + row*128 + lane*32 + k32"
  equivalence: "rowpack[rowpack_index(branch,row,lane,k32)] == block[block_index(branch,physical_j(row,k32),lane)]"

current_asm_boundary:
  producer: _ntt32_8way
  row_count: 3
  vectors_per_row: 32
  vector_lanes: 8
  row_vector_semantics: >
    After one row NTT32, vector q[k32] contains branch0 quartic lanes 0..3 in
    the low D half and branch1 quartic lanes 0..3 in the high D half for the
    same row,k32.
  current_scatter:
    implementations:
      - "default NTT32_FUSED_SCATTER=1: fused stores inside asm/slothy/my_32ntt.opt.s stage345 blocks"
      - "NTT32_FUSED_SCATTER=0: separate asm/my_ntt.s _scatter_ntt32_row loop"
    stores:
      - "low D -> block_index(0, physical_j(row,k32), lane 0..3)"
      - "high D -> block_index(1, physical_j(row,k32), lane 0..3)"
    per_full_poly_store_model:
      d_stores: 192
      high_half_extracts: "96 conceptual extracts; fused stage345 may schedule them with live outputs"
      unfused_extra_q_loads: 96
      fused_extra_q_loads: 0
      note: "This describes the block-major store shape, not a fixed instruction sequence."

target_scatter_contract:
  input_semantics: "same row_vector_semantics as current_asm_boundary"
  output_stores:
    - "low half lane l -> rowpack_index(0,row,l,k32)"
    - "high half lane l -> rowpack_index(1,row,l,k32)"
  implication: >
    A production rowpack Forward NTT output path can start as a scatter
    replacement at the existing NTT32 row boundary.  It will need to transpose
    the 32 fixed-k32 vectors into branch,row,lane planes, so the first asm
    prototype should measure only this output packing before rewriting the
    arithmetic.
  symbolic_v2:
    source: asm/slothy/ntt32_v2_symbolic.s
    arithmetic: "same stage12 and stage345 arithmetic as asm/slothy/ntt32_symbolic.s"
    packing: "per stage345 block, transpose 8 reduced Q vectors into 8 rowpack plane Q stores"
    store_offsets:
      block_b: "byte chunk offset = 16*b"
      branch0_lane_l: "[scatter_ptr + 64*l + 16*b]"
      branch1_lane_l: "[scatter_ptr + 768 + 64*l + 16*b]"

validation:
  portable_gate: test_gt_forward_rowpack_output_contract
  asm_gate: test_gt_forward_rowpack_v2_asm
  v3_register_order_gate: test_gt_rowpack_forward_v3_register_order_contract
  fullpath_gates:
    - test_gt_rowpack_soa_invntt32_fullpath_forward_v2
    - test_gt_rowpack_soa_invntt32_fullpath_forward_v2_nativebasemul
  checks:
    - "row/physical_j/k32 mapping is bijective over all 768 coefficients"
    - "current row-vector scatter converted through block_to_rowpack equals direct rowpack scatter"
    - "v2 transpose-block scatter model equals current row-vector scatter converted through block_to_rowpack"
    - "direct rowpack Forward NTT equals block-major ntt_gt_rowbitrevlayout followed by block_to_rowpack"
    - "linked asm/my_ntt.s plus ntt32_8way.rowpack_v2.n1.opt.s emits rowpack output matching the same oracle"
    - "rowpack Forward NTT v2 composes with the rowpack InvNTT32 kernel and rowpack basemul/add harness"
  patterns:
    - zero
    - one
    - alternating +/-1
    - alternating +/-q/2
    - deterministic random

next_candidate_gate:
  name: pi5_forward_v2_native_rowpack_cycle_benchmark
  prerequisite: "test_gt_forward_rowpack_v2_asm and fullpath forward_v2 gates pass"
  commands:
    - make bench_gt_rowpack_pipeline_forward_v2_nativebasemul_cycles_compare
  benchmark_rule: >
    Compare only production-equivalent call boundaries using Linux hardware
    cycle counters.  Keep rowpack oracle full-path numbers diagnostic only.

pi5_forward_v2_overhead_evidence:
  command: "make bench_gt_rowpack_forward_v2_overhead_breakdown"
  alias: "make bench_gt_rowpack_forward_output_overhead"
  probe_source: "gt_test/bench_gt_rowpack_forward_overhead.c"
  compare_script: "docs/gt_soa_layout_experiment/compare_rowpack_forward_overhead.py"
  direct_medians_cycles:
    production_gt_forward_ntt: 2701.172
    current_rowpack_forward_v2: 3015.812
    rowpack_scatter_transpose_only: 319.297
    gt_to_rowpack_scalar_conversion: 3361.156
  derived_medians_cycles:
    rowpack_overhead_per_ntt: 314.640
    rowpack_compute_only_estimate: 2696.515
    rowpack_compute_only_estimate_vs_gt: -4.657
    production_gt_plus_scalar_conversion: 6062.328
    production_gt_plus_scalar_conversion_vs_rowpack_v2: 3046.516
  probe_contracts:
    rowpack_scatter_transpose_only: >
      Loads prepared row-vector memory with the same eight-lane semantics as
      _ntt32_8way output, applies a Neon 8x8 halfword transpose per 8-k32
      block, and stores rowpack branch/row/lane planes.  It excludes NTT
      arithmetic and final reduction.
    rowpack_compute_only_estimate: >
      Derived as current_rowpack_forward_v2 - rowpack_scatter_transpose_only.
      This is not a standalone correctness kernel because v2 currently fuses
      stage345 arithmetic, final reduction, transpose, and rowpack stores in
      one Slothy block.
    gt_to_rowpack_scalar_conversion: >
      Direct scalar conversion from production GT block-major output to
      rowpack SoA layout.  It tests the first hybrid baseline, not a tuned
      conversion.
  conclusion: >
    The rowpack Forward v2 overhead is explained by output scatter/transpose,
    not by the NTT arithmetic schedule: the direct scatter/transpose probe is
    about 319 cycles, while the compute-only estimate is within about 2 cycles
    of production GT Forward.  This passes the strong continue gate for a
    Forward-output optimization because the recoverable region is above 200
    cycles per NTT.  The scalar hybrid path is not viable: production GT
    Forward plus scalar GT-to-rowpack conversion is about 3046 cycles slower
    than current rowpack v2.  The next candidate should target rowpack Forward
    output scatter/register order, not InvNTT fusion, add-path glue, or a
    scalar conversion bridge.

pi5_forward_scatter_lower_bound_evidence:
  command: "make bench_gt_rowpack_forward_scatter_lower_bound"
  direct_medians_cycles:
    production_gt_forward_ntt: 2696.594
    current_rowpack_forward_v2: 3015.828
    rowpack_scatter_transpose_only: 319.328
    rowpack_lane_store_candidate: 1986.516
    rowpack_store_ready_load_store: 109.359
    rowpack_zero_store_lower_bound: 96.828
    rowpack_transpose_only_no_store: 266.703
    gt_to_rowpack_scalar_conversion: 3471.812
  derived_medians_cycles:
    rowpack_overhead_per_ntt: 319.234
    rowpack_compute_only_estimate: 2696.500
    rowpack_compute_only_estimate_vs_gt: -0.094
    scatter_minus_zero_store_lower_bound: 222.500
    scatter_minus_store_ready_load_store: 209.969
    lane_store_candidate_vs_current_scatter: 1667.188
    production_gt_plus_scalar_conversion: 6168.406
    production_gt_plus_scalar_conversion_vs_rowpack_v2: 3152.578
  probe_contracts:
    rowpack_store_ready_load_store: >
      Loads rowpack-ready plane vectors from memory and stores them to the
      rowpack output addresses.  This excludes the 8x8 transpose but includes
      source-vector loads, rowpack stores, and address generation.
    rowpack_zero_store_lower_bound: >
      Stores fixed vectors to the same rowpack output addresses without
      source-vector loads.  This is the lower bound for store/address traffic
      in this C/Neon probe.
    rowpack_transpose_only_no_store: >
      Loads the current row-vector shape and runs the same 8x8 halfword
      transpose, accumulating into a small sink instead of writing rowpack
      output planes.
    rowpack_lane_store_candidate: >
      Loads current row-vector outputs and writes rowpack planes directly with
      Neon lane stores, avoiding the 8x8 transpose but replacing vector stores
      with many scalar lane stores.
  conclusion: >
    The current rowpack Forward output cost is dominated by the permutation
    network, not by stores alone.  Store/address lower bounds are about
    97-109 cycles per Forward NTT, while current scatter/transpose is about
    319 cycles and transpose-only/no-store costs about 267 cycles.  This leaves
    roughly 210-223 cycles per NTT as a plausible recoverable region if a
    register-order candidate can produce rowpack plane vectors directly.  The
    lane-store store-order candidate is rejected because it is about 1.67k
    cycles slower than current scatter/transpose.  The next candidate should
    change stage345/register layout rather than replacing transpose with lane
    stores.

forward_v3_register_order_gate:
  status: contract_only_no_opt_s_candidate
  commands:
    - make test_gt_rowpack_forward_v3_register_order_contract
    - make bench_gt_rowpack_forward_v3_register_order_lower_bound
    - make bench_gt_rowpack_forward_v3_register_order_cycles
  oracle_source: "gt_test/test_gt_rowpack_forward_v3_register_order_contract.c"
  symbolic_handoff: "asm/slothy/ntt32_v3_rowpack_stage345_symbolic.s"
  non_goals:
    - "Do not change the Forward NTT arithmetic, twiddle order, or reduction schedule."
    - "Do not replace the vector-store path with lane stores."
    - "Do not treat the symbolic handoff stub as a generated .opt.s candidate."
  required_liveout: >
    For each Good-Thomas row and each k32 block b, stage345 should make eight
    rowpack-ready plane vectors live before store.  Plane p has p/4 as branch,
    p%4 as quartic lane, and vector lane v as k32=8*b+v.  Storing those vectors
    directly must produce rowpack_index(branch,row,lane,k32).
  cycle_gate: >
    Until a real v3 assembly candidate exists, the lower-bound target reuses
    the Gate 4 probes and prints a note that no v3 candidate is implemented.
    The shorter cycles target is currently an alias for that lower-bound gate.
    A weak candidate should recover at least about 100 cycles/NTT from the
    current rowpack v2 Forward path; a strong candidate should recover about
    200 cycles/NTT, approaching the measured store-ready floor.

forward_v3_structured_store_candidate:
  status: reject
  candidate: "asm/slothy/ntt32_8way.rowpack_v3.n1.opt.s"
  gate_artifacts: "docs/gt_soa_layout_experiment/forward_v3_candidate_gate6/"
  commands:
    - make test_gt_rowpack_forward_v3_candidate
    - make bench_gt_rowpack_forward_v3_candidate_cycles
    - make bench_gt_rowpack_lazy_asm_v3_forward_fullchain_compare
  pi5_results:
    correctness: pass
    production_gt_forward_ntt: 2701.109
    v3_structured_store_forward_ntt: 3151.984
    v3_delta_vs_gt: 450.875
    product_pipeline_delta_vs_gt: 386.703
    product_add_pipeline_delta_vs_gt: 968.078
  conclusion: >
    Reject this first v3 micro-candidate.  The layout contract is preserved,
    but replacing the final transpose network with structured lane stores is
    slower than the current v2 transpose plus vector-store path on Pi5.  The
    next useful v3 attempt must change stage345 register order/arithmetic so
    rowpack plane vectors are naturally live before store, not merely change
    the final store instruction form.

forward_stage345_liveout_audit:
  status: audit_only_no_candidate
  command: "make audit_gt_rowpack_forward_stage345_liveout"
  artifact: "docs/gt_soa_layout_experiment/audit_forward_stage345_liveout.py"
  purpose: >
    Freeze the Gate 7 handoff after the Gate 6 structured-store rejection.
    The audit records the current rowpack-v2 stage345 live-out registers, the
    v2 final transpose source order, and the rowpack-ready target plane vectors
    that a future v3 candidate should make live before plain vector stores.
  store_policy:
    allowed:
      - "str qN, [public_offset]"
      - "st1 {vN.8h}, [public_offset]"
    forbidden:
      - "st4 structured stores"
      - "lane stores"
      - "scalar strh scatter"
      - "scalar GT-to-rowpack conversion"
  cost_model:
    v2_final_permute_per_block:
      trn: 24
      vector_stores: 8
    v2_final_permute_full_ntt32_row:
      trn: 96
      vector_stores: 32
    gate6_structured_store_per_block:
      mov: 8
      address_add: 8
      st4_lane_store: 16
  next_candidates:
    v3a_final_permute_only: >
      Optional weak candidate.  Try to reduce the 24-trn-per-block final tail,
      but keep vector stores only.  Weak pass should recover at least about
      50 cycles/NTT versus rowpack v2; strong pass should recover at least
      about 100 cycles/NTT.
    v3b_true_stage345_liveout_rewrite: >
      Preferred candidate.  Change stage345 arithmetic/register order so the
      rowpack plane vectors are naturally live-out.  Weak pass should recover
      at least about 100 cycles/NTT; strong pass should recover about
      200 cycles/NTT, approaching the measured store-ready floor.
  slothy_role: >
    Slothy should schedule and register-allocate a selected good symbolic DAG.
    It should not choose the transformed layout, and it should not promote
    structured stores, lane stores, or scalar scatter as the output primitive.

forward_stage345_layout_search:
  status: complete_static_search_no_candidate
  command: "make test_gt_rowpack_forward_stage345_layout_search"
  artifact_dir: "docs/gt_soa_layout_experiment/forward_stage345_layout_search/"
  artifacts:
    - current_liveout.json
    - target_rowpack_planes.json
    - required_permutation.json
    - candidate_sequences.json
    - layout_search_summary.md
  allowed_ops:
    - trn1
    - trn2
    - zip1
    - zip2
    - uzp1
    - uzp2
    - ext
    - rev64
    - mov
    - orr
    - plain_vector_store
  forbidden_ops:
    - st4
    - lane_store
    - scalar_scatter
    - scalar_GT_to_rowpack_conversion
  result:
    current_v2_final_tail_permutes_per_block: 24
    two_input_interleave_lower_bound_permutes_per_block: 24
    best_final_only_permutes_per_block: 24
    uses_only_allowed_ops: true
    requires_forbidden_store_or_scatter: false
  conclusion: >
    Final-only v3a has no instruction-count headroom under the allowed Neon
    two-input interleave model.  The current v2 final tail already matches the
    24-permute/block lower bound for an 8x8 16-bit transpose.  The next useful
    candidate is v3b: rewrite stage345 arithmetic/register order so rowpack
    plane vectors are naturally live-out, then use plain vector stores.

forward_v3b_stage345_contract:
  status: contract_scaffold_no_candidate
  command: "make test_gt_rowpack_forward_v3b_stage345_contract"
  artifact_dir: "docs/gt_soa_layout_experiment/forward_v3b_stage345/"
  artifacts:
    - kernel-contract.yml
    - instruction-dag.yml
    - README.md
    - "../check_forward_v3b_stage345_contract.py"
  intended_symbolic_source: "asm/slothy/ntt32_v3b_rowpack_stage345_symbolic.s"
  intended_optimized_output: "asm/slothy/ntt32_8way.rowpack_v3b.n1.opt.s"
  mode: new_symbolic_kernel
  candidate_status: investigate
  store_policy:
    allowed:
      - "str qN, [public_offset]"
      - "st1 {vN.8h}, [public_offset]"
    forbidden:
      - st4
      - lane_store
      - scalar_scatter
      - scalar_GT_to_rowpack_conversion
  future_targets:
    - make bench_gt_rowpack_forward_v3b_stage345_cycles
    - make bench_gt_rowpack_lazy_asm_v3b_forward_fullchain_compare
  benchmark_status: "blocked until the v3b optimized ASM candidate exists"
  conclusion: >
    Gate 9 starts the v3b path without generating candidate assembly.  The next
    step is symbolic stage345 arithmetic/layout authoring that produces rowpack
    plane vectors as natural live-outs.  Slothy should only schedule that chosen
    DAG after the symbolic candidate exists and passes static checks.

forward_v3b_stage345_feasibility:
  status: blocked_current_stage12_boundary
  command: "make test_gt_rowpack_forward_v3b_symbolic_candidate"
  artifacts:
    - "docs/gt_soa_layout_experiment/forward_v3b_stage345/feasibility-summary.md"
    - "docs/gt_soa_layout_experiment/forward_v3b_stage345/feasibility.yml"
  boundary:
    input_shape: "k32-major vectors from current stage12 scratch"
    desired_output_shape: "rowpack plane vectors"
  result:
    stage345_arithmetic_lane_preserving: true
    required_lane_mixing_lower_bound_permutes_per_block: 24
    matches_gate8_final_only_lower_bound: true
  conclusion: >
    Do not author a current-boundary stage345-only v3b symbolic candidate.
    Starting from the existing k32-major stage12 scratch, stage345 arithmetic
    preserves lane indices.  Rowpack plane live-out still needs a
    transpose-equivalent 24-permute/block lane-mixing network, so this would
    move the Gate 8 cost rather than remove it.  The next viable scope must
    widen to stage12+stage345 or change the stage12 scratch/live-out contract.

forward_v3c_stage12_stage345_layout_search:
  status: complete_static_search_no_asm_candidate
  command: "make test_gt_rowpack_forward_v3c_stage12_stage345_layout_search"
  artifact_dir: "docs/gt_soa_layout_experiment/forward_v3c_stage12_stage345_layout_search/"
  artifacts:
    - current_stage12_liveout.yml
    - candidate_stage12_liveout.yml
    - stage345_input_contract.yml
    - stage345_output_contract.yml
    - layout_search_summary.md
  scope: "stage12 scratch/live-out contract plus stage345 input/output layout"
  store_policy:
    allowed:
      - trn1
      - trn2
      - zip1
      - zip2
      - uzp1
      - uzp2
      - ext
      - rev64
      - mov
      - orr
      - plain_vector_store
    forbidden:
      - st4
      - lane_store
      - scalar_scatter
      - scalar_GT_to_rowpack_conversion
  cost_model:
    current_tail_permutes_per_block: 24
    current_scatter_cycles_per_ntt: 319.328
    store_ready_cycles_per_ntt: 109.359
    recoverable_window_cycles_per_ntt: 209.969
  contracts:
    A_current:
      stage12_extra_permutes_per_block: 0
      stage345_extra_permutes_per_block: 0
      remaining_final_tail_permutes_per_block: 24
      total_estimated_permutes_per_block: 24
      decision: baseline
    B_partial_rowpack_friendly_scratch:
      stage12_extra_permutes_per_block: 8
      stage345_extra_permutes_per_block: 8
      remaining_final_tail_permutes_per_block: 16
      total_estimated_permutes_per_block: 32
      decision: reject
    C_fully_rowpack_friendly_scratch_layout_only:
      stage12_extra_permutes_per_block: 24
      stage345_extra_permutes_per_block: 0
      remaining_final_tail_permutes_per_block: 0
      total_estimated_permutes_per_block: 24
      decision: no_headroom
  conclusion: >
    Do not build a v3c candidate that only changes stage12 scratch layout.
    Forward output overhead is caused by a layout mismatch already fixed at the
    stage12 scratch boundary.  Once stage12 emits k32-major vectors,
    lane-preserving stage345 arithmetic cannot naturally produce rowpack plane
    vectors.  A layout-only stage12 scratch change either worsens total
    permutation cost or ties the same 24-permute/block lower bound before
    scratch store/load and register pressure.  The remaining open scope is a
    larger stage12 arithmetic topology rewrite or an earlier forward contract
    change.
