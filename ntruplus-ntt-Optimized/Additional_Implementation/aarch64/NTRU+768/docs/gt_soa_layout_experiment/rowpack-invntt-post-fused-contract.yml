    instrumentation_note: >
      The chunked-transpose-only and rowvec-load-only stage targets write the
      same 96 vectors to a scratch sink and use compiler memory barriers around
      each batched helper call.  This prevents the optimizer from hoisting
      repeated idempotent scratch writes out of the benchmark loop.  These rows
