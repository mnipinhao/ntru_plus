  pi5_rowvec_direct_postmerge_evidence:
    commands:
      layout_contract: "make test_gt_rowvec_layout_contract"
      basemul_gate: "make bench_gt_basemul_rowvec_cycles"
      postmerge_gate: "make bench_gt_rowpack_invntt_nativepost_chunked_isolate_cycles"
    rowvec_layout:
      index_formula: "rowvec_index(row,k32,blane) = row*256 + k32*8 + blane"
      lane_mapping: "blane 0..3 = branch 0 quartic lanes; blane 4..7 = branch 1 quartic lanes"
      physical_j: "physical_j = (32*row + 3*k32) mod 96"
