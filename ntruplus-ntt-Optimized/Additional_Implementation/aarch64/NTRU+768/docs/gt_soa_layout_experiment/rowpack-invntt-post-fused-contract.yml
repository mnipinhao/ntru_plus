artifact: gt-rowpack-invntt-post-fused-contract
version: 1
scope:
  scheme: NTRU+768
  operation: Rowpack SoA InvNTT post-row fused merge prototype
  source_files:
    harness: gt_test/test_gt_rowpack_soa_invntt32_fullpath.c
    production_reference: asm/slothy/invntt_opt.s
    row_kernel: docs/gt_soa_layout_experiment/kernels/ntruplus768_invntt32_rowpack_soa_row.opt.S
    lazy_no_entry_no_end_row_kernel: docs/gt_soa_layout_experiment/kernels/ntruplus768_invntt32_rowpack_soa_row_no_entry_no_end.S
    lazy_postmerge_asm: docs/gt_soa_layout_experiment/kernels/ntruplus768_invntt32_rowpack_postmerge_branchfold.S
  build_gate:
    macro: ROWPACK_NATIVE_POSTMERGE
    status: opt_in_only
  non_goals:
    - Do not promote into production poly_invntt by default.
    - Do not change the rowpack transformed-domain ABI.
    - Do not use SVE, SVE2, SME, or value-dependent memory access.

input_layout:
  name: gt_rowpack_soa_after_invntt32_rows
  dimensions:
    branches: 2
    rows: 3
    quartic_lanes: 4
    k32_per_row: 32
  index_formula: "rowpack_index(branch,row,lane,k32) = branch*384 + row*128 + lane*32 + k32"
  row_meaning: "row == k3"
  k32_meaning: "natural 32-point row output index after ntruplus768_invntt32_rowpack_soa_row"
  gather_vector:
    lane_0: "branch 0, quartic lane 0"
    lane_1: "branch 0, quartic lane 1"
    lane_2: "branch 0, quartic lane 2"
    lane_3: "branch 0, quartic lane 3"
    lane_4: "branch 1, quartic lane 0"
    lane_5: "branch 1, quartic lane 1"
    lane_6: "branch 1, quartic lane 2"
    lane_7: "branch 1, quartic lane 3"

operation:
  per_k32:
    loads:
      - "y0 = gather row 0, k32 into branch/lane vector"
      - "y1 = gather row 1, k32 into branch/lane vector"
      - "y2 = gather row 2, k32 into branch/lane vector"
    inverse_dft3:
      d: "barrett(y2 - y1)"
      t: "fqmul(d, GT96_OMEGA3)"
      x0: "barrett(y0 + y1 + y2)"
      x1: "barrett(y0 - y1 + t)"
      x2: "barrett(y0 - y2 - t)"
    output_blocks:
      x0_n: "(33*k32) mod 96"
      x1_n: "(64 + 33*k32) mod 96"
      x2_n: "(128 + 33*k32) mod 96"

production_merge_equivalence:
  reference: "asm/slothy/invntt_opt.s POST_STORE_PTR_BRANCHFOLD"
  folded_formula:
    out_low: "b0*F0^n*(1-ZMINUSZ5INV)/192 + b1*F1^n*(1+ZMINUSZ5INV)/192"
    out_high: "b0*F0^n*ZMINUSZ5INV/96 - b1*F1^n*ZMINUSZ5INV/96"
  implementation_note: >
    The prototype stores Montgomery-form folded constants and uses the existing
    Neon fqmul_vec helper.  Production assembly uses normal multipliers plus
    sqrdmulh precompute constants.  Both implement the same branchfold formula;
    the prototype follows production branchfold-reduce output convention, not
    the older scalar rowpack C postmerge representative convention.
  final_reduction: "Barrett reduce low/high sums before storing, matching production branchfold-reduce policy."
  representative_note: >
    Values may differ from the scalar rowpack C postmerge by +/-q while still
    matching modulo q.  This is expected for the production-style reduced
    convention and must be handled explicitly before any KEM/crepmod3 promotion.

output_layout:
  name: canonical_poly_order
  stores:
    low_half: "r[4*n + lane] for lane 0..3"
    high_half: "r[384 + 4*n + lane] for lane 0..3"
  scratch_policy:
    branches_scratch: forbidden
    stack_mat_3x32: forbidden
    rowpack_input_copy: allowed only outside this post kernel

cost_model:
  expected_wins:
    - "removes scalar branches[768] scratch traffic"
    - "folds untwist, branch merge, and final scaling into two vector folded multiplications per output block"
    - "keeps production-style DFT3 and final store ordering"
  expected_costs:
    - "rowpack SoA input still requires branch/lane gather per k32"
    - "current C intrinsic prototype may compile lane inserts instead of optimal assembly loads"
  next_asm_target: >
    The opt-in native postmerge is now backed by a dedicated AArch64 Neon
    assembly kernel under ROWPACK_NATIVE_POSTMERGE_ASM.  Further work should
    target rowkernel-to-postmerge fusion or full-chain hardening, not another
    public transformed-domain layout rewrite.
  adopted_followups:
    hand_asm_lazy_postmerge: >
      The lazy no-entry/no-end rowkernel can link against
      ntruplus768_invntt32_rowpack_postmerge_branchfold_asm, which consumes the
      same rowpack row output contract and emits the production-style
      branchfold final layout directly.  This remains opt-in and does not
      replace production GT symbols.
    branchfold_mul2: >
      The branchfold store combines branch 0 and branch 1 products in the
      32-bit product accumulator and performs one Montgomery reduction for the
      combined low or high output lane group.  This replaces the older
      multiply-then-vext-add-Barrett combine.
    running_stride33_indices: >
      The postmerge loop tracks n0, n1, and n2 as public running indices with
      stride 33 modulo 96, avoiding per-iteration reciprocal-multiply modulo
      code for output positions and folded-constant lookup.
    hot_path_init_policy: >
      Folded constants are initialized before correctness or benchmark hot
      paths.  The postmerge kernel assumes the tables are ready and no longer
      calls the init guard per InvNTT.
    pipeline_inplace_policy: >
      Full-pipeline benchmarks can opt into ROWPACK_PIPELINE_INVNTT_INPLACE so
      InvNTT consumes the pointwise output buffer as row scratch.  Standalone
      InvNTT component measurements keep copying input to preserve repeated
      measurement semantics.
    chunked_gather_default: >
      The native postmerge gather now processes eight k32 outputs at a time.
      For each row, it loads contiguous branch/lane rowpack planes and applies
      an 8x8 Neon transpose to produce the branch/lane vectors consumed by the
      existing DFT3 and branchfold arithmetic.  The old scalar lane-insert
      gather remains available only through ROWPACK_NATIVE_POSTMERGE_SCALAR_GATHER.
  pi5_nativepost_evidence:
    command_isolate: "make bench_gt_rowpack_invntt_nativepost_isolate_cycles"
    command_pipeline: "make bench_gt_rowpack_pipeline_forward_v2_nativebasemul_nativepost_cycles_compare"
    medians_cycles:
      rowpack_invntt_copy: 104.125
      rowpack_invntt_rowkernels_with_copy: 3280.188
      rowpack_invntt_rowkernels_estimated: 3176.063
      old_c_postmerge: 13769.422
      staged_c_postmerge: 7629.797
      native_postmerge: 3205.938
      native_invntt: 6586.656
      active_invntt_with_nativepost: 6511.641
      product_pipeline_with_nativepost: 14928.094
      product_add_pipeline_with_nativepost: 18098.750
    production_reference_medians_cycles:
      product_invntt: 4035.844
      product_pipeline: 12269.953
      product_add_invntt: 4021.859
      product_add_pipeline: 14984.688
    conclusion: >
      Native postmerge removes the original C/local-stack postmerge artifact and
      improves the forward-v2 nativebasemul rowpack pipelines by about 10.7k
      cycles.  The remaining production gap is dominated by rowpack InvNTT:
      about 6.5k cycles versus about 4.0k cycles for the promoted GT inverse.
      The next target is assembly postmerge scheduling and/or row-output layout
      changes that reduce the remaining rowpack InvNTT cost, not more scalar
