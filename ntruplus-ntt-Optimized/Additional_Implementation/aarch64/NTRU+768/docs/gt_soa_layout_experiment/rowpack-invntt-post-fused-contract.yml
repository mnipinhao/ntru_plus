    conclusion: >
      Rowvec direct native postmerge is correctness-clean and removes the
      rowpack chunked-gather/transpose load shape from the postmerge input.
      The isolated win is only about 0.21k cycles, and converting rowpack rows
      to rowvec rows costs about the same amount.  This is below the provisional
      ~0.8k InvNTT improvement gate for beginning a full Forward-v3 / basemul /
      InvNTT ABI rewrite.  Keep the rowvec contract and benchmarks as evidence,
      but do not promote the ABI without a larger row-kernel or postmerge
      arithmetic win.
  pi5_stage_split_evidence:
    command: "make bench_gt_rowpack_invntt_stage_cycles"
    medians_cycles:
      input_copy: 104.078
      rowkernels_with_copy: 3292.031
