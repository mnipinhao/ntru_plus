  pi5_chunked_gather_evidence:
    commands:
      correctness: "make test_gt_rowpack_soa_invntt32_fullpath_forward_v2_nativebasemul_nativepost"
      isolate: "make bench_gt_rowpack_invntt_nativepost_isolate_cycles"
