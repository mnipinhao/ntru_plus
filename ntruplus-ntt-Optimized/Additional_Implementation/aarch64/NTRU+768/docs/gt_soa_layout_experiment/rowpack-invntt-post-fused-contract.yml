    conclusion: >
      The rowpack chunked load/transpose is not the remaining large blocker:
      replacing it with direct rowvec loads saves only about 0.10k cycles at
      the load/layout boundary and about 0.21k cycles for the full postmerge.
      The remaining rowpack InvNTT gap must be explained by row-kernel
      arithmetic/internal shuffle cost and the native folded postmerge
      arithmetic/store path.  Splitting row-kernel arithmetic from internal
      row-kernel shuffle requires a row-kernel variant or a static
