    conclusion: >
      Chunked gather is correctness-clean and cycle-positive, so it is now the
      default ROWPACK_NATIVE_POSTMERGE gather path.  It removes roughly 0.58k
      cycles from active rowpack InvNTT and full-path product/add pipelines.
      The remaining gap is no longer the scalar lane gather artifact; closing it
