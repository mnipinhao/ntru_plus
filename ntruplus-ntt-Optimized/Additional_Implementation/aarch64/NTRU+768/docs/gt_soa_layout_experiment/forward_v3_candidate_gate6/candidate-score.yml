candidate:
  id: gt_rowpack_forward_v3_structured_store
  status: reject

summary:
  decision: >
    Reject the structured-store v3 micro-candidate.  It preserves correctness
    but replaces the v2 trn network with structured lane stores that are slower
    on Pi5/A76.
  next_hypothesis: >
    A useful v3 must change stage345 register order or arithmetic layout so
    rowpack plane vectors are naturally live before store.  Merely replacing
    the final transpose with lane/structured stores is not sufficient.

